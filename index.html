    function addCat() {
        const input = document.getElementById('newCatInput');
        const name = input.value.trim();
        if(!name) return;
        if(db.catOrder.includes(name)) { alert("分類名稱已存在"); return; }
        db.catOrder.push(name);
        if(!db.bookmarks[name]) db.bookmarks[name] = [];
        input.value = '';
        save(); renderManageUI();
    }

    function renameCat(idx, newName) {
        newName = newName.trim();
        if(!newName) return;
        const old = db.catOrder[idx];
        if(old === newName) return;
        if(db.catOrder.includes(newName)) { alert("名稱已存在"); renderManageUI(); return; }
        db.catOrder[idx] = newName;
        db.bookmarks[newName] = db.bookmarks[old] || [];
        delete db.bookmarks[old];
        if(currentCat === old) currentCat = newName;
        save(); renderManageUI();
    }

    function deleteCat(idx) {
        const cat = db.catOrder[idx];
        const count = (db.bookmarks[cat] || []).length;
        if(count > 0 && !confirm(`「${cat}」含有 ${count} 筆書籤，確定刪除？`)) return;
        if(count === 0 && !confirm(`刪除分類「${cat}」？`)) return;
        db.catOrder.splice(idx, 1);
        delete db.bookmarks[cat];
        if(currentCat === cat) currentCat = db.catOrder[0] || '';
        save(); renderManageUI();
    }

    function moveCat(idx, dir) {
        const newIdx = idx + dir;
        if(newIdx < 0 || newIdx >= db.catOrder.length) return;
        [db.catOrder[idx], db.catOrder[newIdx]] = [db.catOrder[newIdx], db.catOrder[idx]];
        save(); renderManageUI();
    }

    function addBookmarkContent() {
        const input = document.getElementById('bmInput');
        const text = input?.value.trim() || '';
        if(!currentCat) return;
        if(!db.bookmarks[currentCat]) db.bookmarks[currentCat] = [];
        // 若輸入欄有內容直接存，否則新增空草稿進編輯模式
        const newItem = { date: new Date().toLocaleDateString(), text, _isNew: true };
        db.bookmarks[currentCat].push(newItem);
        const newIdx = db.bookmarks[currentCat].length - 1;
        if(input) { input.value = ''; input.style.height = '42px'; }
        if(text) {
            delete newItem._isNew;
            save(); renderBookmarkUI();
        } else {
            bmEditState[newIdx] = true;
            renderBookmarkUI();
        }
    }
    function delBookmarkItem(idx) { if(confirm("刪除內容？")) { db.bookmarks[currentCat].splice(idx, 1); save(); renderBookmarkUI(); }}


    // ===== 搜尋功能 =====
    let searchItems = [];

    function openSearch() {
        document.getElementById('searchOverlay').classList.add('open');
        setTimeout(() => document.getElementById('searchInput').focus(), 300);
    }

    function closeSearch() {
        document.getElementById('searchOverlay').classList.remove('open');
        document.getElementById('searchInput').value = '';
        document.getElementById('searchResults').innerHTML = '<div class="search-empty">輸入關鍵字開始搜尋</div>';
    }

    function highlight(text, kw) {
        const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return text.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
    }

    function doSearch(kw) {
        const results = document.getElementById('searchResults');
        kw = kw.trim();
        if (!kw) {
            results.innerHTML = '<div class="search-empty">輸入關鍵字開始搜尋</div>';
            return;
        }
        const kwLower = kw.toLowerCase();
        searchItems = [];

        // 時間軸
        Object.entries(db.journals).forEach(([date, entries]) => {
            (entries || []).forEach(j => {
                if (j.text.toLowerCase().includes(kwLower)) {
                    searchItems.push({
                        type: '時間軸', date, text: j.text, meta: j.time + '　' + date,
                        action: () => {
                            closeSearch();
                            const d = new Date(date);
                            viewMonth = new Date(d); drawerMonth = new Date(d);
                            selectDate(date, false);
                            switchPanel(0);
                            setTimeout(() => {
                                const flow = document.getElementById('journalFlow');
                                if (flow) flow.scrollTop = 0;
                            }, 200);
                        }
                    });
                }
            });
        });

        // 行事曆
        Object.entries(db.calendar).forEach(([date, text]) => {
            if (text && text.toLowerCase().includes(kwLower)) {
                searchItems.push({
                    type: '行事曆', date, text, meta: date,
                    action: () => {
                        closeSearch();
                        const d = new Date(date);
                        viewMonth = new Date(d);
                        selectDate(date, false);
                        switchPanel(2);
                        setTimeout(() => {
                            const el = document.getElementById('list-' + date);
                            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 200);
                    }
                });
            }
        });

        // 書籤
        db.catOrder.forEach(cat => {
            (db.bookmarks[cat] || []).forEach(b => {
                if (b.text.toLowerCase().includes(kwLower)) {
                    searchItems.push({
                        type: '書籤・' + cat, date: b.date || '', text: b.text, meta: b.date || '',
                        action: () => {
                            closeSearch();
                            currentCat = cat;
                            switchPanel(3);
                        }
                    });
                }
            });
        });

        // 購物
        (db.shop || []).forEach(card => {
            const fields = [];
            if(card.title)   fields.push(card.title);
            if(card.program) fields.push(card.program);
            if(card.venue)   fields.push(card.venue);
            if(card.zone)    fields.push(card.zone);
            if(card.seat)    fields.push(card.seat);
            (card.items || []).forEach(it => { if(it.name) fields.push(it.name); });
            const combined = fields.join(' ');
            if(combined.toLowerCase().includes(kwLower)) {
                const sortDate = getShopSortDate(card);
                const displayText = card.category === '表演'
                    ? (card.program || card.title || '（未命名）')
                    : (card.title || (card.items||[]).map(it=>it.name).filter(Boolean).join('、') || '（未命名）');
                searchItems.push({
                    type: '購物・' + (card.category || ''), date: sortDate, text: displayText,
                    meta: sortDate + (card.currency ? '　' + (currencies[card.currency]||card.currency) : ''),
                    action: () => {
                        closeSearch();
                        if(sortDate) shopViewMonth = new Date(sortDate.slice(0,7) + '-01T00:00:00');
                        currentShopCat = card.category || '全部';
                        switchPanel(4);
                    }
                });
            }
        });

        // 星象：當前星象
        if(Array.isArray(db.astro?.current)) {
            db.astro.current.forEach(item => {
                const combined = [item.title, item.period, item.text].filter(Boolean).join(' ');
                if(combined.toLowerCase().includes(kwLower)) {
                    searchItems.push({
                        type: '星象・當前', date: item.dateStart || '', text: item.title || item.text || '（未命名）',
                        meta: item.period || '',
                        action: () => { closeSearch(); switchPanel(5); }
                    });
                }
            });
        }

        // 星象：月/週運勢
        ['month', 'week'].forEach(type => {
            const data = db.astro?.[type];
            if(!data) return;
            const label = type === 'month' ? '月運勢' : '週運勢';
            const combined = [data.period, data.text, ...Object.values(data.signs||{})].filter(Boolean).join(' ');
            if(combined.toLowerCase().includes(kwLower)) {
                searchItems.push({
                    type: '星象・' + label, date: '', text: data.text || data.period || label,
                    meta: data.period || '',
                    action: () => { closeSearch(); switchPanel(5); }
                });
            }
            // 各星座
            Object.entries(data.signs || {}).forEach(([sign, text]) => {
                if(text && text.toLowerCase().includes(kwLower)) {
                    searchItems.push({
                        type: `星象・${label}・${sign}`, date: '', text,
                        meta: data.period || '',
                        action: () => { closeSearch(); switchPanel(5); }
                    });
                }
            });
        });

        // 星盤
        (db.astro?.charts || []).forEach(chart => {
            [...(chart.positions||[]), ...(chart.houses||[])].forEach(row => {
                const combined = Object.values(row).join(' ');
                if(combined.toLowerCase().includes(kwLower)) {
                    searchItems.push({
                        type: '星盤・' + (chart.name || ''), date: '', text: combined,
                        meta: chart.name || '',
                        action: () => { closeSearch(); switchPanel(5); }
                    });
                }
            });
        });

        searchItems.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

        if (searchItems.length === 0) {
            results.innerHTML = '<div class="search-empty">找不到相關結果</div>';
            return;
        }

        results.innerHTML = searchItems.map((item, idx) => {
            const safeText = item.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            return `<div class="search-result-item" onclick="searchItems[${idx}].action()">
                <div class="search-result-source">${item.type}</div>
                <div class="search-result-text">${highlight(safeText, kw)}</div>
                <div class="search-result-meta">${item.meta}</div>
            </div>`;
        }).join('');
    }


    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }



    // ── 購物商品拖移排序 ─────────────────────────────────────────────
    let shopDragSrcCardId = null;
    let shopDragSrcIdx    = null;

    function attachShopDragHandlers() {
        document.querySelectorAll('.shop-item-row[draggable]').forEach(row => {
            row.addEventListener('dragstart', e => {
                shopDragSrcCardId = parseInt(row.dataset.cardId);
                shopDragSrcIdx    = parseInt(row.dataset.idx);
                row.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });
            row.addEventListener('dragend', () => {
                row.classList.remove('dragging');
                document.querySelectorAll('.shop-item-row.drag-over')
                    .forEach(r => r.classList.remove('drag-over'));
            });
            row.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                document.querySelectorAll('.shop-item-row.drag-over')
                    .forEach(r => r.classList.remove('drag-over'));
                if(parseInt(row.dataset.idx) !== shopDragSrcIdx) {
                    row.classList.add('drag-over');
                }
            });
            row.addEventListener('drop', e => {
                e.preventDefault();
                const destIdx = parseInt(row.dataset.idx);
                if(shopDragSrcIdx === null || shopDragSrcIdx === destIdx) return;
                const card = db.shop.find(c => c.id === shopDragSrcCardId);
                if(!card) return;
                // 先從 DOM 同步目前輸入值
                syncCardFromDOM(card);
                // 重新排序 items
                const moved = card.items.splice(shopDragSrcIdx, 1)[0];
                card.items.splice(destIdx, 0, moved);
                save();
                renderShop();
            });
        });

        // Touch 拖移（手機）
        document.querySelectorAll('.shop-drag-handle').forEach(handle => {
            let touchRow = null, touchSrcIdx = null, touchCardId = null, cloneEl = null;

            handle.addEventListener('touchstart', e => {
                touchRow    = handle.closest('.shop-item-row');
                touchCardId = parseInt(touchRow.dataset.cardId);
                touchSrcIdx = parseInt(touchRow.dataset.idx);
                touchRow.classList.add('dragging');
                // 建立視覺複製
                cloneEl = touchRow.cloneNode(true);
                cloneEl.style.cssText = 'position:fixed;z-index:9000;opacity:0.85;pointer-events:none;width:' + touchRow.offsetWidth + 'px;background:#2c2c2e;border-radius:10px;padding:6px;';
                document.body.appendChild(cloneEl);
            }, { passive: true });

            handle.addEventListener('touchmove', e => {
                e.preventDefault();
                const t = e.touches[0];
                if(cloneEl) { cloneEl.style.left = (t.clientX - 30) + 'px'; cloneEl.style.top = (t.clientY - 20) + 'px'; }
                // 找到目前手指下的 row
                document.querySelectorAll('.shop-item-row.drag-over').forEach(r => r.classList.remove('drag-over'));
                const el = document.elementFromPoint(t.clientX, t.clientY);
                const overRow = el?.closest('.shop-item-row[draggable]');
                if(overRow && parseInt(overRow.dataset.idx) !== touchSrcIdx) overRow.classList.add('drag-over');
            }, { passive: false });

            handle.addEventListener('touchend', e => {
                if(cloneEl) { cloneEl.remove(); cloneEl = null; }
                if(touchRow) touchRow.classList.remove('dragging');
                document.querySelectorAll('.shop-item-row.drag-over').forEach(r => r.classList.remove('drag-over'));
                const t = e.changedTouches[0];
                const el = document.elementFromPoint(t.clientX, t.clientY);
                const destRow = el?.closest('.shop-item-row[draggable]');
                if(!destRow) return;
                const destIdx = parseInt(destRow.dataset.idx);
                if(touchSrcIdx === null || touchSrcIdx === destIdx) return;
                const card = db.shop.find(c => c.id === touchCardId);
                if(!card) return;
                syncCardFromDOM(card);
                const moved = card.items.splice(touchSrcIdx, 1)[0];
                card.items.splice(destIdx, 0, moved);
                save(); renderShop();
            });
        });
    }


    // ══════════ 照片月曆 ══════════════════════════════════════
    let photoViewMonth = new Date();

    function changePhotoMonth(dir) {
        photoViewMonth = new Date(photoViewMonth.getFullYear(), photoViewMonth.getMonth() + dir, 1);

    function renderPhotoCalendar() {
        const grid = document.getElementById('photoCalGrid'); if(!grid) return;
        const titleEl = document.getElementById('photoMonthTitle');
        const y = photoViewMonth.getFullYear(), m = photoViewMonth.getMonth();
        if(titleEl) titleEl.textContent = `${y} 年 ${String(m+1).padStart(2,'0')} 月`;

        if(!db.photos) db.photos = {};
        const today = getDS();
        const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
        const daysInMonth = new Date(y, m+1, 0).getDate();

        grid.innerHTML = '';
        // 空格
        for(let k=0; k<firstDay; k++) {
            const blank = document.createElement('div');
            blank.className = 'photo-cell empty';
            grid.appendChild(blank);
        }
        for(let d=1; d<=daysInMonth; d++) {
            const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isWeekend = [0,6].includes(new Date(y,m,d).getDay());
            const isToday   = ds === today;
            const cell = document.createElement('div');
            cell.className = 'photo-cell' + (isToday?' today':'') + (db.photos[ds]?' has-photo':'');
            const photoData = db.photos[ds];
            if(photoData) {
                const img = document.createElement('img');
                img.src = photoData;
                img.loading = 'lazy';
                cell.appendChild(img);
                cell.onclick = () => openPhotoPreview(ds);
            } else {
                const add = document.createElement('span');
                add.className = 'photo-cell-add';
                add.textContent = '+';
                cell.appendChild(add);
                cell.onclick = () => triggerPhotoUpload(ds);
            }
            const dateLabel = document.createElement('span');
            dateLabel.className = 'photo-cell-date' + (isWeekend?' weekend':'');
            dateLabel.textContent = d;
            cell.appendChild(dateLabel);
            grid.appendChild(cell);
        }
    }

    function triggerPhotoUpload(ds) {
        pendingPhotoDate = ds;
        document.getElementById('photoFileInput').value = '';
        document.getElementById('photoFileInput').click();
    }

    function handlePhotoUpload(e) {
        const file = e.target.files[0]; if(!file || !pendingPhotoDate) return;
        const reader = new FileReader();
        reader.onload = ev => {
            // 縮小圖片以節省 localStorage
            const img = new Image();
            img.onload = () => {
                const MAX = 600;
                const ratio = Math.min(MAX/img.width, MAX/img.height, 1);
                const canvas = document.createElement('canvas');
                canvas.width  = Math.round(img.width  * ratio);
                canvas.height = Math.round(img.height * ratio);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                const data = canvas.toDataURL('image/jpeg', 0.7);
                if(!db.photos) db.photos = {};
                db.photos[pendingPhotoDate] = data;
                save();
                renderPhotoCalendar();
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }

    function openPhotoPreview(ds) {
        currentPreviewDate = ds;
        document.getElementById('photoPreviewImg').src = db.photos[ds];
        const d = new Date(ds+'T00:00:00');

    function closePhotoPreview(e) {

        document.getElementById('photoPreviewOverlay').classList.add('hidden');

    const shopCats = ['全部', '3C', '衣物', '鞋包', '表演', '好市多', '其他'];
    let shopViewMonth = new Date(); // 當前檢視的年月

    function changeShopMonth(dir) {
        shopViewMonth = new Date(shopViewMonth.getFullYear(), shopViewMonth.getMonth() + dir, 1);
        renderShopTabs(); renderShop();
    }

    function getShopMonthPrefix() {
        const y = shopViewMonth.getFullYear(), m = shopViewMonth.getMonth() + 1;
        return `${y}-${String(m).padStart(2,'0')}`;
    }
    const currencies = { 'TWD': 'NT$', 'JPY': '¥', 'KRW': '₩', 'USD': '$' };
    let currentShopCat = '全部';

    function fmtPrice(currency, price) {
        const sym = currencies[currency] || currency;
        const num = parseFloat(price);
        if(isNaN(num)) return sym + '0';
        return sym + num.toLocaleString();
    }

    function renderShopTabs() {
        const el = document.getElementById('shopTabs'); if(!el) return;
        el.innerHTML = shopCats.map(cat =>
            `<button class="shop-tab ${currentShopCat===cat?'active':''}" onclick="currentShopCat='${cat}';renderShopTabs();renderShop()">${cat}</button>`
        ).join('');
    }

    function getShopSortDate(card) {
        return card.category === '表演' ? (card.perfDate || card.date || '') : (card.date || '');
    }

    function renderShop() {
        const grid = document.getElementById('shopGrid'); if(!grid) return;
        const prefix = getShopMonthPrefix();
        const y = shopViewMonth.getFullYear(), m = shopViewMonth.getMonth() + 1;

        // 更新 header 月份標題
        const titleEl = document.getElementById('shopMonthTitle');
        if(titleEl) titleEl.textContent = `${y} 年 ${String(m).padStart(2,'0')} 月`;

        // 過濾：先過濾月份，再過濾分類
        let cards = db.shop.filter(c => {
            const sortDate = getShopSortDate(c);
            return sortDate.startsWith(prefix) || (!c.published && !sortDate); // 未發佈草稿也顯示
        });
        if(currentShopCat !== '全部') cards = cards.filter(c => c.category === currentShopCat);
        cards.sort((a,b) => getShopSortDate(a).localeCompare(getShopSortDate(b)));

        // 計算當月已發佈 TWD 合計（只計 TWD，其他幣別標注）
        const summary = {};
        cards.filter(c => c.published).forEach(card => {
            const cur = card.currency || 'TWD';
            let amt = 0;
            if(card.category === '表演') {
                amt = parseFloat(card.price) || 0;
            } else {
                amt = (card.items||[]).reduce((s,it) => s + (parseFloat(it.price)||0), 0);
            }
            if(!summary[cur]) summary[cur] = 0;
            summary[cur] += amt;
        });
        const summaryEl = document.getElementById('shopMonthSummary');
        const amtEl = document.getElementById('shopMonthAmount');
        const publishedCards = cards.filter(c => c.published);
        if(summaryEl && amtEl) {
            if(publishedCards.length > 0) {
                summaryEl.style.display = 'flex';
                amtEl.textContent = Object.entries(summary)
                    .map(([cur, amt]) => (currencies[cur]||cur) + amt.toLocaleString())
                    .join('　');
            } else {
                summaryEl.style.display = 'none';
            }
        }

        grid.innerHTML = '';
        cards.forEach(card => {
            const div = document.createElement('div');
            div.setAttribute('data-card-id', card.id);
            if(!card.published) {
                div.innerHTML = buildEditCard(card);
            } else {
                div.innerHTML = card.category === '表演' ? buildTicketCard(card) : buildViewCard(card);
            }
            grid.appendChild(div);
        });
        // 新增按鈕
        const addBtn = document.createElement('button');
        addBtn.className = 'shop-add-card-btn';
        addBtn.textContent = '＋ 新增記帳';
        addBtn.onclick = addShopCard;
        grid.appendChild(addBtn);
        grid.scrollTop = 0;
        attachShopDragHandlers();
    }

    function buildEditCard(card) {
        const isPerf = card.category === '表演';
        const isNew = !card._wasPublished; // 從未發佈過 → 取消時直接刪除
        const headerNote = `<input class="shop-card-title" placeholder="${isPerf ? '備注' : '備注（地點、用途）'}" value="${escHtml(card.title||'')}">`;
        const currSel = `<select class="shop-currency-select">${['TWD','JPY','KRW','USD'].map(c=>`<option value="${c}" ${card.currency===c?'selected':''}>${c}</option>`).join('')}</select>`;
        const btnRow = `<div class="shop-btn-row">
            <button class="shop-cancel-btn" onclick="cancelShopCard(${card.id}, ${isNew})">取消</button>
            <button class="shop-publish-btn" onclick="publishShopCard(${card.id})">儲存</button>
        </div>`;

        if(isPerf) {
            return `<div class="shop-card-edit">
                <div class="shop-card-header">${headerNote}${currSel}</div>
                <input class="perf-field perf-program" placeholder="節目名稱" value="${escHtml(card.program||'')}">
                <div class="perf-row">
                    <input type="date" class="perf-field perf-perfdate" value="${card.perfDate||''}">
                    <input type="time" class="perf-field perf-perftime" value="${card.perfTime||''}">
                </div>
                <input class="perf-field perf-zone" placeholder="票價區域（如：A區）" value="${escHtml(card.zone||'')}">
                <input class="perf-field perf-seat" placeholder="座位（如：3排5號）" value="${escHtml(card.seat||'')}">
                <input class="perf-field perf-venue" placeholder="場地" value="${escHtml(card.venue||'')}">
                <input type="date" class="shop-date-input" placeholder="購買日期" value="${card.date||''}">
                <input type="number" class="perf-price-input perf-price" placeholder="票價" value="${escHtml(card.price||'')}">
                ${btnRow}
            </div>`;
        } else {
            const rows = (card.items||[{name:'',price:''}]).map((it,i) =>
                `<div class="shop-item-row" draggable="true" data-card-id="${card.id}" data-idx="${i}">
                    <span class="shop-drag-handle">⠿</span>
                    <input class="shop-item-name" placeholder="商品名稱" value="${escHtml(it.name||'')}">
                    <input class="shop-item-price" placeholder="0" type="number" value="${escHtml(it.price||'')}">
                    <button class="shop-item-del" onclick="delShopItemDirect(${card.id},${i})">✕</button>
                </div>`).join('');
            return `<div class="shop-card-edit" id="shopEdit_${card.id}">
                <div class="shop-card-header">
                    <input type="date" class="shop-date-input" style="width:auto;flex:1;" value="${card.date||''}">
                    ${headerNote}${currSel}

                <div class="shop-items-list" data-card-id="${card.id}">${rows}</div>
                <button class="shop-add-item-btn" onclick="addShopItemDirect(${card.id})">＋ 新增商品</button>
                ${btnRow}
            </div>`;
        }
    }

    function buildViewCard(card) {
        const sym = currencies[card.currency] || 'NT$';
        const items = card.items || [];
        const total = items.reduce((s,it) => s + (parseFloat(it.price)||0), 0);
        const rows = items.map(it =>
            `<div class="shop-item-line"><span>${escHtml(it.name)}</span><span>${sym}${(parseFloat(it.price)||0).toLocaleString()}</span></div>`
        ).join('');
        return `<div class="shop-card-view" onclick="editShopCard(${card.id})">
            <button class="shop-card-del" onclick="event.stopPropagation();delShopCard(${card.id})">✕</button>

            ${card.title ? `<div class="shop-card-titletext">${escHtml(card.title)}</div>` : ''}

            ${rows}

    function buildTicketCard(card) {

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function syncCardFromDOM(card) {
        const el = document.querySelector(`[data-card-id="${card.id}"]`);
        if(!el) return;
        const titleEl = el.querySelector('.shop-card-title');
        if(titleEl) card.title = titleEl.value;
        const curEl = el.querySelector('.shop-currency-select');
        if(curEl) card.currency = curEl.value;
        if(card.category === '表演') {
            card.date     = el.querySelector('.shop-date-input')?.value || card.date;
            card.perfDate = el.querySelector('.perf-perfdate')?.value || '';
            card.perfTime = el.querySelector('.perf-perftime')?.value || '';
            card.program  = el.querySelector('.perf-program')?.value || '';
            card.zone     = el.querySelector('.perf-zone')?.value || '';
            card.venue    = el.querySelector('.perf-venue')?.value || '';
            card.seat     = el.querySelector('.perf-seat')?.value || '';
            card.price    = el.querySelector('.perf-price')?.value || '';
        } else {
            card.date = el.querySelector('.shop-date-input')?.value || card.date;
            card.items = [];
            el.querySelectorAll('.shop-item-row').forEach(row => {
                const name = row.querySelector('.shop-item-name')?.value || '';
                const price = row.querySelector('.shop-item-price')?.value || '';
                if(name || price) card.items.push({ name, price });
            });
        }
    }

        const isPerf = currentShopCat === '表演';
        const cat = (currentShopCat === '全部') ? '其他' : currentShopCat;
        const card = {
            id: Date.now(),
            date: getDS(),
            title: '',
            currency: 'TWD',
            category: cat,
            published: false,
            items: isPerf ? undefined : [{ name:'', price:'' }],
            ...(isPerf ? { perfDate:'', perfTime:'', program:'', zone:'', seat:'', venue:'', price:'' } : {})
        };
        db.shop.push(card);
        save();
        renderShop();
    }

    function publishShopCard(id) {
        const card = db.shop.find(c => c.id === id);
        if(!card) return;
        syncCardFromDOM(card);
        card.published = true;
        card._wasPublished = true;
        save(); renderShop();
    }

    function editShopCard(id) {
        const card = db.shop.find(c => c.id === id);
        if(!card) return;
        card._wasPublished = true; // 已發佈過，取消時恢復
        card.published = false;
        save(); renderShop();
    }

    function cancelShopCard(id, isNew) {
        if(isNew) {
            // 從未儲存過 → 直接刪掉
            db.shop = db.shop.filter(c => c.id !== id);
        } else {
            // 已儲存過 → 恢復 published 狀態
            const card = db.shop.find(c => c.id === id);
            if(card) card.published = true;
        }
        save(); renderShop();
    }

    function delShopCard(id) {
        if(!confirm('確定刪除這筆記帳？')) return;
        db.shop = db.shop.filter(c => c.id !== id);
        save(); renderShop();
    }

    function addShopItemDirect(id) {
        const card = db.shop.find(c => c.id === id);
        if(!card) return;
        syncCardFromDOM(card);
        card.items.push({ name:'', price:'' });
        save(); renderShop();
    }

    function delShopItemDirect(id, idx) {
        const card = db.shop.find(c => c.id === id);
        if(!card) return;
        syncCardFromDOM(card);
        card.items.splice(idx, 1);
        if(card.items.length === 0) card.items.push({ name:'', price:'' });
        save(); renderShop();
    }

                            <span class="astro-date-sep">～</span>
                            <input type="date" class="astro-date-input" id="curDateEnd_${item.id}" value="${item.dateEnd||''}">
                        </div>
                        <textarea class="astro-fortune-textarea" id="curText_${item.id}" rows="4" placeholder="詳細說明...">${aEsc(item.text)}</textarea>
                        <div class="astro-btn-row">
                            <button class="astro-icon-btn" style="padding:9px 12px;color:rgba(255,100,100,0.7);border:1px solid rgba(255,100,100,0.25);" onclick="delCurAstroItem(${item.id})">刪除</button>
                            <button class="astro-cancel-btn" onclick="astroCurEditingId=null;renderAstroPanel()">取消</button>
                            <button class="astro-save-btn" onclick="saveCurAstroItem(${item.id})">✦ 儲存</button>
                        </div>`;
                } else {
                    itemEl.style.cursor = 'default';
                    itemEl.innerHTML = `
                        <div style="font-size:0.9rem;font-weight:bold;color:#d4aaff;margin-bottom:3px;">${item.title ? aEsc(item.title) : '（未命名）'}</div>
                        ${item.period ? `<div class="astro-fortune-period" style="margin-bottom:6px;">📅 ${aEsc(item.period)}</div>` : ''}
                        ${item.text ? `<div class="astro-fortune-text" style="font-size:0.9rem;">${aEsc(item.text)}</div>` : ''}`;
                    itemEl.ondblclick = () => { astroCurEditingId = item.id; renderAstroPanel(); };
                }
                body.appendChild(itemEl);
            });
            // 最後一個不要底線
            const last = body.lastElementChild;
            if(last) last.style.borderBottom = 'none';
        }

        inner.appendChild(header);
        inner.appendChild(body);
        section.appendChild(inner);
        return section;
    }

    function addCurAstroItem() {
        if(!Array.isArray(db.astro.current)) db.astro.current = [];
        const newId = Date.now();
        db.astro.current.push({id: newId, title:'', period:'', text:''});
        astroCurEditingId = newId;
        db.astro.collapsed['current'] = false;
        save(); renderAstroPanel();
        setTimeout(()=>{ document.getElementById(`curItem_${newId}`)?.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 100);
    }
    function saveCurAstroItem(id) {
        const item = db.astro.current.find(i=>i.id===id); if(!item) return;
        item.title     = document.getElementById(`curTitle_${id}`)?.value.trim()||'';
        item.dateStart = document.getElementById(`curDateStart_${id}`)?.value||'';
        item.dateEnd   = document.getElementById(`curDateEnd_${id}`)?.value||'';
        item.period    = fmtAstroPeriod(item.dateStart, item.dateEnd);
        item.text      = document.getElementById(`curText_${id}`)?.value.trim()||'';
        save(); astroCurEditingId=null; renderAstroPanel();
    }

    function fmtAstroPeriod(start, end) {
        const fmt = ds => {
            if(!ds) return '';
            const d = new Date(ds + 'T00:00:00');
            return `${d.getFullYear()} 年 ${String(d.getMonth()+1).padStart(2,'0')} 月 ${String(d.getDate()).padStart(2,'0')} 日`;
        };
        const s = fmt(start), e = fmt(end);
        if(s && e) return `${s} ～ ${e}`;
        return s || e;
    }
    function delCurAstroItem(id) {
        if(!confirm('確定刪除此項目？')) return;
        db.astro.current = db.astro.current.filter(i=>i.id!==id);
        save(); renderAstroPanel();
    }

    // ── 收合區塊包裝 ──
    function buildAstroSection(type) {
        const isMonth = type === 'month';
        const key = type;
        const collapsed = !!db.astro.collapsed[key];
        const titleLabel = isMonth ? '✦ 月運勢' : '✦ 週運勢';
        const data = db.astro[type];
        const hasContent = data.text?.trim() || Object.values(data.signs||{}).some(v=>v?.trim());

        const section = document.createElement('div');
        section.className = 'astro-section';
        section.id = `astroSection_${type}`;

        const inner = document.createElement('div');
        inner.className = 'astro-section-inner';

        // Header（點擊收合）
        const header = document.createElement('div');
        header.className = 'astro-collapse-header';
        header.innerHTML = `
            <span class="astro-collapse-title">${titleLabel}</span>
            <div class="astro-collapse-right">
                ${!collapsed ? `
                    <button class="astro-icon-btn" onclick="event.stopPropagation();clearAstroFortune('${type}')" style="color:rgba(255,120,120,0.7);">清除</button>
                    <button class="astro-icon-btn" onclick="event.stopPropagation();startAstroFortune('${type}')">編輯 ✎</button>
                ` : ''}
                <span class="astro-collapse-arrow ${collapsed?'':'open'}">▲</span>
            </div>`;
        header.onclick = () => toggleAstroCollapse(key);

        // Body
        const body = document.createElement('div');
        body.className = `astro-collapse-body${collapsed?' hidden':''}`;
        body.id = `astroBody_${type}`;

        if (astroEditState[type]) {
            body.innerHTML = buildFortureEditHtml(type, data);
        } else {
            body.innerHTML = buildFortuneViewHtml(type, data);
            setTimeout(() => attachChipListeners(body, type), 0);
        }

        inner.appendChild(header);
        inner.appendChild(body);
        section.appendChild(inner);
        return section;
    }

    function buildFortuneViewHtml(type, data) {
        const isMonth = type === 'month';
        const chipsHtml = ASTRO_SIGNS.map(s => {
            const has = data.signs?.[s]?.trim();
            return `<span class="astro-sign-chip ${has?'has-note':''}" data-type="${type}" data-sign="${s}">${s}</span>`;
        }).join('');
        return `
            ${data.period ? `<div class="astro-fortune-period">📅 ${aEsc(data.period)}</div>` : ''}
            ${data.text   ? `<div class="astro-fortune-text">${aEsc(data.text)}</div>` : `<div class="astro-fortune-empty">尚未填寫整體運勢 ✨</div>`}
            <div class="astro-signs-row">${chipsHtml}</div>`;
    }

    function buildFortureEditHtml(type, data) {
        const isMonth = type === 'month';
        const signsHtml = ASTRO_SIGNS.map(s =>
            `<div class="astro-sign-block">
                <label>${s}</label>
                <textarea class="astro-fortune-textarea astro-sign-ta" data-sign="${s}" rows="2" placeholder="運勢內容...">${aEsc(data.signs?.[s]||'')}</textarea>
            </div>`
        ).join('');
        return `
            <input class="astro-fortune-input" id="astro_${type}_period" placeholder="${isMonth?'月份（如：2026年3月）':'週期（如：3/3–3/9）'}" value="${aEsc(data.period)}">
            <textarea class="astro-fortune-textarea" id="astro_${type}_text" rows="4" placeholder="整體${isMonth?'月':'週'}運勢概述...">${aEsc(data.text)}</textarea>
            <div style="font-size:0.7rem;color:rgba(200,170,255,0.55);letter-spacing:1.5px;margin:12px 0 6px;">各星座運勢</div>
            <div class="astro-signs-grid">${signsHtml}</div>
            <div class="astro-btn-row">
                <button class="astro-cancel-btn" onclick="cancelAstroFortune('${type}')">取消</button>
                <button class="astro-save-btn" onclick="saveAstroFortune('${type}')">✦ 儲存</button>
            </div>`;
    }

    function attachChipListeners(body, type) {
        body.querySelectorAll('.astro-sign-chip').forEach(chip => {
            chip.addEventListener('click', e => {
                e.stopPropagation();
                const sign = chip.dataset.sign;
                const t    = chip.dataset.type;
                const text = db.astro[t]?.signs?.[sign];
                if(!text?.trim()) return;
                openAstroSignModal(sign, text);
            });
        });
    }

    function toggleAstroCollapse(key) {
        db.astro.collapsed[key] = !db.astro.collapsed[key];
        save(); renderAstroPanel();
    }

    function startAstroFortune(type) { astroEditState[type]=true; renderAstroPanel(); }
    function cancelAstroFortune(type) { astroEditState[type]=false; renderAstroPanel(); }
    function clearAstroFortune(type) {
        if(!confirm(`確定清除所有${type==='month'?'月':'週'}運勢內容？`)) return;
        db.astro[type] = {period:'', text:'', signs:{}};
        save(); astroEditState[type]=false; renderAstroPanel();
    }
    function saveAstroFortune(type) {
        db.astro[type].period = document.getElementById(`astro_${type}_period`)?.value.trim()||'';
        db.astro[type].text   = document.getElementById(`astro_${type}_text`)?.value.trim()||'';
        if(!db.astro[type].signs) db.astro[type].signs={};
        document.getElementById(`astroBody_${type}`)?.querySelectorAll('.astro-sign-ta').forEach(el=>{
            db.astro[type].signs[el.dataset.sign] = el.value.trim();
        });
        save(); astroEditState[type]=false; renderAstroPanel();
    }

    function openAstroSignModal(sign, text) {
        let modal = document.getElementById('astroSignModal');
        if(modal) modal.remove();
        modal = document.createElement('div');
        modal.id = 'astroSignModal';
        modal.style.cssText = 'position:fixed;inset:0;z-index:800;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0.55);';
        modal.onclick = e => { if(e.target===modal) modal.remove(); };
        modal.innerHTML = `<div style="background:linear-gradient(160deg,#0d0d2b,#1a0a2e);border:1px solid rgba(150,100,255,0.3);border-radius:20px 20px 0 0;padding:24px 20px 36px;width:100%;max-width:500px;max-height:70vh;overflow-y:auto;">
            <div style="font-size:1.05rem;font-weight:bold;color:#d4aaff;margin-bottom:14px;">${sign}</div>
            <div style="font-size:0.95rem;color:#e8d5ff;line-height:1.7;white-space:pre-wrap;">${aEsc(text)}</div>
            <button onclick="document.getElementById('astroSignModal').remove()" style="margin-top:20px;width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:rgba(255,255,255,0.5);padding:10px;cursor:pointer;font-family:inherit;">關閉</button>
        </div>`;
        document.body.appendChild(modal);
    }

    // ── 多星盤 ──
    function buildAstroChartSection(chart) {
        const key = `chart_${chart.id}`;
        const collapsed = !!db.astro.collapsed[key];
        if(!astroChartState[chart.id]) astroChartState[chart.id] = { tab:'positions', editing:false };
        const state = astroChartState[chart.id];

        const section = document.createElement('div');
        section.className = 'astro-section';

        const inner = document.createElement('div');
        inner.className = 'astro-section-inner';

        const header = document.createElement('div');
        header.className = 'astro-collapse-header';
        header.innerHTML = `
            <span class="astro-collapse-title">✦ ${aEsc(chart.name)}</span>
            <div class="astro-collapse-right">
                ${!collapsed ? `
                    <button class="astro-icon-btn" onclick="event.stopPropagation();delAstroChart(${chart.id})" style="color:rgba(255,100,100,0.65);">刪除</button>
                    <button class="astro-icon-btn" onclick="event.stopPropagation();startChartEdit(${chart.id})">編輯 ✎</button>
                ` : ''}
                <span class="astro-collapse-arrow ${collapsed?'':'open'}">▲</span>
            </div>`;
        header.onclick = () => toggleAstroCollapse(key);

        const body = document.createElement('div');
        body.className = `astro-collapse-body${collapsed?' hidden':''}`;
        body.id = `astroChartBody_${chart.id}`;
        body.innerHTML = buildChartBodyHtml(chart, state);

        inner.appendChild(header);
        inner.appendChild(body);
        section.appendChild(inner);
        return section;
    }

    function buildChartBodyHtml(chart, state) {
        const cfg = CHART_CFG[state.tab];
        const rows = chart[state.tab] || [];
        const tabsHtml = ['positions','houses'].map(t=>
            `<button class="astro-chart-tab ${state.tab===t?'active':''}" onclick="setChartTab(${chart.id},'${t}')">${t==='positions'?'星位':'宮位'}</button>`
        ).join('');

        // 星盤名稱 & tab
        const nameField = state.editing
            ? `<input class="astro-chart-name-input" id="chartName_${chart.id}" value="${aEsc(chart.name)}" placeholder="星盤名稱">`
            : '';

        if(!state.editing) {
            const tableRows = rows.length===0
                ? `<tr><td colspan="4" style="text-align:center;color:rgba(200,170,255,0.3);padding:16px 0;">尚未填寫，點「編輯」新增</td></tr>`
                : rows.map(r=>`<tr>
                    <td>${aEsc(r[cfg.fields[0]]||'')}</td>
                    <td>${aEsc(r[cfg.fields[1]]||'')}</td>
                    <td>${aEsc(r[cfg.fields[2]]||'')}</td>
                    <td class="astro-note-cell">${aEsc(r[cfg.fields[3]]||'')}</td>
                </tr>`).join('');
            return `
                <div class="astro-chart-tabs">${tabsHtml}</div>
                <table class="astro-table">
                    <thead><tr>${cfg.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>`;
        } else {
            const editRows = rows.map((r,i)=>
                `<div class="astro-chart-edit-row">
                    ${cfg.fields.map((f,fi)=>`<input class="astro-chart-input" data-row="${i}" data-field="${f}" placeholder="${cfg.ph[fi]}" value="${aEsc(r[f]||'')}">` ).join('')}
                    <button class="astro-del-btn" onclick="delChartRow(${chart.id},${i})">✕</button>
                </div>`
            ).join('');
            return `
                <div id="chartEditRows_${chart.id}">
                    ${nameField}
                    <div class="astro-chart-tabs">${tabsHtml}</div>
                    ${editRows}
                </div>
                <button class="astro-add-row-btn" onclick="addChartRow(${chart.id})">＋ 新增一列</button>
                <div class="astro-btn-row">
                    <button class="astro-cancel-btn" onclick="cancelChartEdit(${chart.id})">取消</button>
                    <button class="astro-save-btn" onclick="saveChartEdit(${chart.id})">✦ 儲存</button>
                </div>`;
        }
    }

    function setChartTab(id, tab) {
        if(!astroChartState[id]) astroChartState[id]={tab,editing:false};
        astroChartState[id].tab = tab;
        astroChartState[id].editing = false;
        renderAstroPanel();
    }
    function startChartEdit(id) { astroChartState[id].editing=true; renderAstroPanel(); }
    function cancelChartEdit(id) { astroChartState[id].editing=false; renderAstroPanel(); }

    function syncChartFromDOM(chart) {
        const state = astroChartState[chart.id];
        const container = document.getElementById(`chartEditRows_${chart.id}`);
        if(!container) return;
        const nameEl = document.getElementById(`chartName_${chart.id}`);
        if(nameEl) chart.name = nameEl.value.trim() || chart.name;
        const inputs = container.querySelectorAll('.astro-chart-input');
        const rows = chart[state.tab];
        inputs.forEach(inp => {
            const i = parseInt(inp.dataset.row);
            const f = inp.dataset.field;
            if(rows[i]) rows[i][f] = inp.value;
        });
    }

    function addChartRow(id) {
        const chart = db.astro.charts.find(c=>c.id===id); if(!chart) return;
        syncChartFromDOM(chart);
        const tab = astroChartState[id].tab;
        const blank={}; CHART_CFG[tab].fields.forEach(f=>blank[f]='');
        if(!chart[tab]) chart[tab]=[];
        chart[tab].push(blank);
        save(); renderAstroPanel();
    }
    function delChartRow(id, i) {
        const chart = db.astro.charts.find(c=>c.id===id); if(!chart) return;
        syncChartFromDOM(chart);
        chart[astroChartState[id].tab].splice(i,1);
        save(); renderAstroPanel();
    }
    function saveChartEdit(id) {
        const chart = db.astro.charts.find(c=>c.id===id); if(!chart) return;
        syncChartFromDOM(chart);
        save(); astroChartState[id].editing=false; renderAstroPanel();
    }
    function addAstroChart() {
        const newId = Date.now();
        db.astro.charts.push({id:newId, name:'新星盤', positions:[], houses:[]});
        astroChartState[newId] = {tab:'positions', editing:true};
        save(); renderAstroPanel();
        // 捲到底部
        setTimeout(()=>{ const s=document.getElementById('astroPanelScroll'); if(s) s.scrollTop=s.scrollHeight; },100);
    }
    function delAstroChart(id) {
        if(db.astro.charts.length<=1){ alert('至少保留一個星盤'); return; }
        if(!confirm('確定刪除此星盤？')) return;
        db.astro.charts = db.astro.charts.filter(c=>c.id!==id);
        delete astroChartState[id];
        save(); renderAstroPanel();
    }

    function initApp() {
        currentCat = db.catOrder[0] || "我的筆記";
        goToday();
        renderShopTabs(); renderShop();
        if(window.innerWidth >= 768) switchPanel(1);
        else switchPanel(1);
        updateInputTime();
        setInterval(() => {
            if(document.activeElement !== document.getElementById('jnTimeInput')) updateInputTime();
        }, 60000);
    }

    window.onload = () => {
        // Auth 監聽已在宣告時啟動，登入後自動呼叫 initApp()
    };
</script>

        <button class="search-cancel" onclick="closeSearch()">取消</button>

        <div class="search-empty">輸入關鍵字開始搜尋</div>

</div>
