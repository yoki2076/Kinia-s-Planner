<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kinia's Planner v2</title>

    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root {
            --bg-dark: #121212;
            --header-black: #000000;
            --card-dark: #1e1e1e;
            --text-gray: #b0b0b0;
            --accent-gray: #e0e0e0;
            --accent-red: #ff453a;
            --border: #333;
            --input-bg: #2c2c2e;
            --bm-card: #252525;
        }

        * {
            font-family: "HanziPen TC-Bold", "HanziPen TC", "Apple LiGothic", "Microsoft JhengHei", sans-serif;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-dark);
            color: white; 
            overflow: hidden;
        }

        /* 容器與面板基礎設定 */
        .container { 
            display: flex; 
            height: calc(100vh - 60px); 
            width: 500vw; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            position: fixed;
            top: 0;
            left: 0;
        }
        .panel { 
            width: 100vw; 
            height: 100%; 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            border-right: 1px solid var(--border); 
        }

        .header { 
            background-color: var(--header-black); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 15px; border-bottom: 1px solid var(--border); height: 60px; 
        }

        .btn-sm { background: #252525; color: white; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }

        /* --- 時間軸區域排版優化 --- */
        .journal-flow { flex: 1; overflow-y: auto; padding: 20px; }
        .bubble-item { display: flex; gap: 12px; margin-bottom: 15px; align-items: center; }
        
        /* 統一時間輸入框樣式，隱藏時鐘圖示 */
        .time-input { 
            background: #252525; border: 1px solid rgba(176,176,176,0.3); color: var(--text-gray); 
            border-radius: 8px; padding: 6px 8px; font-size: 0.85rem; outline: none; 
            width: 72px; -webkit-appearance: none; appearance: none; text-align: center;
        }
        .time-input::-webkit-calendar-picker-indicator { 
            display: none;
        }
        
        .text-bubble { 
            background: #2c2c2e; padding: 12px 16px; border-radius: 18px; 
            flex: 1; display: flex; align-items: center; gap: 10px; position: relative; color: white; min-height: 44px;
        }
        .text-bubble div[contenteditable="true"] { flex: 1; outline: none; word-break: break-word; white-space: pre-wrap; cursor: text; line-height: 1.4; }
        .jn-del-btn { background: none; border: none; color: #888; font-size: 1.1rem; cursor: pointer; padding: 0 5px; display: flex; align-items: center; }

        /* 輸入列佈局 */
        .input-bar { 
            padding: 12px; background: #000; border-top: 1px solid var(--border); 
            display: flex; gap: 8px; align-items: center; 
            position: relative; z-index: 10;
        }
        /* 底部輸入列時間欄位，隱藏時鐘圖示 */
        #jnTimeInput::-webkit-calendar-picker-indicator {
            display: none;
        }

        .input-bar input[type="text"], .input-bar textarea { 
            flex: 1; background: #2c2c2e; border: none; border-radius: 20px; 
            padding: 10px 18px; color: white; outline: none; font-family: inherit; font-size: 1rem;
            resize: none; overflow: hidden; min-height: 42px; max-height: 120px; line-height: 1.4;
        }
        .add-circle { 
            background: var(--accent-gray); color: black; width: 42px; height: 42px; 
            border-radius: 50%; border: none; font-size: 1.6rem; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; 
        }

        /* 書籤樣式 */
        .bookmark-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px; background: #1a1a1a; border-bottom: 1px solid #333; scrollbar-width: none; }
        .bookmark-item { background: var(--bm-card); border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid #333; border-left: 4px solid var(--accent-gray); position: relative; }
        .bm-text { font-size: 1rem; color: #eee; line-height: 1.6; margin-bottom: 8px; word-break: break-word; white-space: pre-wrap; }
        .bm-date { font-size: 0.75rem; color: #666; text-align: right; display: block; }
        .bm-del-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #555; cursor: pointer; }

        /* 行事曆與週曆 */
        .list-view { flex: 1; overflow-y: auto; scroll-behavior: smooth; background: var(--bg-dark); }
        .day-row { display: flex; border-bottom: 1px solid var(--border); min-height: 80px; align-items: stretch; }
        .day-row.selected { background: #1a1a1a; border-left: 4px solid var(--accent-gray); }
        .day-num-box { width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--border); background: rgba(255,255,255,0.02); cursor: pointer; }
        .day-num { font-size: 1.3rem; font-weight: bold; }
        .day-weekday { font-size: 0.75rem; }
        .day-content { flex: 1; padding: 15px; outline: none; white-space: pre-wrap; color: #efefef; line-height: 1.4; cursor: text; }
        .is-weekend-text { color: var(--accent-red) !important; }

        .week-grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 15px; overflow-y: auto; }
        .week-card { background: var(--card-dark); border-radius: 12px; padding: 15px; border: 1px solid #333; }
        .week-card.today { border: 2px solid var(--accent-gray); }
        .week-day-title { font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .week-day-content { font-size: 0.95rem; color: #efefef; min-height: 2.5em; outline: none; white-space: pre-wrap; background: var(--input-bg); border-radius: 8px; padding: 10px; border: 1px solid transparent; cursor: text; }

        /* 抽屜導覽 */
        .calendar-drawer { background: #1a1a1a; border-bottom: 1px solid var(--border); overflow: hidden; transition: max-height 0.3s ease; }
        .calendar-drawer.expanded { max-height: 500px; padding-bottom: 15px; }
        .calendar-drawer.collapsed { max-height: 140px; }
        .mini-calendar { padding: 10px 5px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .cal-date { padding: 8px 0; border-radius: 6px; cursor: pointer; font-size: 0.9rem; width: 85%; margin: 0 auto; }
        .cal-date.selected { background: var(--accent-gray); color: #000; font-weight: bold; }
        .cal-date.is-weekend { color: var(--accent-red); }

        /* 導覽列 */
        .nav-bar { position: fixed; bottom: 0; width: 100vw; height: 60px; background: #000; border-top: 1px solid var(--border); display: flex; z-index: 1000; }
        .nav-item { flex: 1; border: none; background: none; color: var(--text-gray); font-size: 0.9rem; cursor: pointer; }
        .nav-item.active { color: white; font-weight: bold; }

        /* 桌面端響應式 */
        @media (min-width: 768px) {
            .container { width: 100vw; height: 100vh; transform: none !important; position: static; }
            .panel { width: 35%; height: calc(100vh - 60px); }
            #journalPanel { width: 65%; display: flex !important; }
            #weekPanel, #listPanel, #bookmarkPanel, #shopPanel { display: none; }
            #weekPanel.active-left, #listPanel.active-left, #bookmarkPanel.active-left, #shopPanel.active-left { display: flex; }
            .nav-bar { width: 35%; }
            .nav-item:nth-child(5) { display: none; }
        }

        /* --- 搜尋 --- */
        .search-overlay {
            position: fixed; inset: 0; background: var(--bg-dark);
            z-index: 500; display: flex; flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-overlay.open { transform: translateY(0); }
        .search-header {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 15px; background: #000;
            border-bottom: 1px solid var(--border); height: 60px; flex-shrink: 0;
        }
        .search-input {
            flex: 1; background: #1e1e1e; border: 1px solid #444;
            border-radius: 20px; padding: 10px 18px; color: white;
            outline: none; font-size: 1rem; font-family: inherit;
        }
        .search-cancel { background: none; border: none; color: var(--accent-gray); font-size: 0.95rem; cursor: pointer; white-space: nowrap; padding: 0 4px; }
        .search-results { flex: 1; overflow-y: auto; padding: 12px 15px; }
        .search-empty { color: #555; text-align: center; margin-top: 60px; font-size: 0.95rem; }
        .search-result-item {
            background: #1e1e1e; border: 1px solid #fff;
            border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; cursor: pointer;
            transition: background 0.15s;
        }
        .search-result-item:active { background: #2a2a2a; }
        .search-result-source { font-size: 0.72rem; color: var(--accent-red); letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase; }
        .search-result-text { color: #efefef; font-size: 0.95rem; line-height: 1.5; }
        .search-result-text mark { background: #f5c518; color: #000; border-radius: 3px; padding: 0 2px; font-style: normal; }
        .search-result-meta { color: #888; font-size: 0.75rem; margin-top: 5px; }
        .icon-btn { background: none; border: none; color: var(--accent-gray); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; border-radius: 6px; opacity: 0.8; }
        .icon-btn:active { opacity: 1; background: #222; }

        /* ── 購物記帳 ── */
        .shop-tabs { display:flex; gap:8px; padding:10px 14px; overflow-x:auto; background:#0a0a0a; border-bottom:1px solid var(--border); flex-shrink:0; scrollbar-width:none; }
        .shop-tabs::-webkit-scrollbar { display:none; }
        .shop-tab { background:#1e1e1e; color:var(--text-gray); border:1px solid var(--border); border-radius:20px; padding:5px 14px; font-size:0.82rem; cursor:pointer; white-space:nowrap; flex-shrink:0; }
        .shop-tab.active { background:var(--accent-gray); color:#000; font-weight:bold; border-color:var(--accent-gray); }

        .shop-grid { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }

        /* 編輯卡片 */
        .shop-card-edit { background:#1e1e1e; border:1px solid #444; border-radius:16px; padding:14px 15px; display:flex; flex-direction:column; gap:10px; }
        .shop-card-header { display:flex; gap:8px; align-items:center; }
        .shop-card-title { flex:1; background:#2c2c2e; border:none; border-radius:10px; padding:9px 13px; color:white; font-size:0.95rem; outline:none; font-family:inherit; }
        .shop-currency-select { background:#2c2c2e; border:none; border-radius:10px; padding:9px 10px; color:var(--accent-gray); font-size:0.85rem; outline:none; cursor:pointer; font-family:inherit; }
        .shop-currency-select option { background:#1e1e1e; }
        .shop-date-input { background:#2c2c2e; border:none; border-radius:10px; padding:8px 10px; color:var(--text-gray); font-size:0.85rem; outline:none; font-family:inherit; width:100%; -webkit-appearance:none; }
        .shop-date-input::-webkit-calendar-picker-indicator { filter:invert(70%); cursor:pointer; }
        .shop-item-row { display:flex; gap:6px; align-items:center; }
        .shop-item-name { flex:2; background:#2c2c2e; border:none; border-radius:10px; padding:8px 12px; color:white; font-size:0.9rem; outline:none; font-family:inherit; }
        .shop-item-price { flex:1; background:#2c2c2e; border:none; border-radius:10px; padding:8px 10px; color:var(--accent-gray); font-size:0.9rem; outline:none; font-family:inherit; text-align:right; min-width:0; }
        .shop-item-del { background:none; border:none; color:#555; font-size:1rem; cursor:pointer; padding:4px; flex-shrink:0; }
        .shop-add-item-btn { background:none; border:1px dashed #444; border-radius:10px; color:#666; font-size:0.85rem; padding:7px; cursor:pointer; width:100%; text-align:center; }
        .shop-add-item-btn:active { background:#252525; }
        .shop-publish-btn { background:var(--accent-gray); color:#000; border:none; border-radius:10px; padding:10px; font-size:0.9rem; font-weight:bold; cursor:pointer; width:100%; }

        /* 表演欄位 */
        .perf-row { display:flex; gap:8px; }
        .perf-field { flex:1; background:#2c2c2e; border:none; border-radius:10px; padding:8px 12px; color:white; font-size:0.88rem; outline:none; font-family:inherit; min-width:0; }
        .perf-field::placeholder { color:#555; }
        .perf-field[type="date"]::-webkit-calendar-picker-indicator,
        .perf-field[type="time"]::-webkit-calendar-picker-indicator { filter:invert(70%); cursor:pointer; -webkit-appearance:none; }
        .perf-price-input { background:#2c2c2e; border:none; border-radius:10px; padding:8px 12px; color:var(--accent-gray); font-size:0.9rem; outline:none; font-family:inherit; width:100%; text-align:right; }

        /* 唯讀卡片（一般） */
        .shop-card-view { background:#1e1e1e; border:1px solid #fff; border-radius:16px; padding:14px 15px; cursor:pointer; position:relative; }
        .shop-card-view:active { background:#252525; }
        .shop-badge { display:inline-block; font-size:0.7rem; color:var(--accent-red); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
        .shop-card-meta { font-size:0.78rem; color:#666; margin-bottom:4px; }
        .shop-card-titletext { font-size:1rem; font-weight:bold; color:var(--accent-gray); margin-bottom:10px; }
        .shop-divider { border:none; border-top:1px solid #333; margin:8px 0; }
        .shop-item-line { display:flex; justify-content:space-between; font-size:0.9rem; color:#ddd; padding:3px 0; }
        .shop-item-line.total { border-top:1px solid #333; margin-top:4px; padding-top:8px; font-weight:bold; color:white; }
        .shop-card-del { position:absolute; top:10px; right:12px; background:none; border:none; color:#555; font-size:0.9rem; cursor:pointer; padding:2px 6px; z-index:2; }

        /* 票卡（表演唯讀） */
        .ticket-card { border:1px solid #fff; border-radius:16px; overflow:visible; cursor:pointer; position:relative; }
        .ticket-card:active { opacity:0.85; }
        .ticket-top { background:linear-gradient(135deg,#1e1e2e 0%,#252535 100%); border-left:4px solid var(--accent-gray); border-radius:16px 16px 0 0; padding:16px 16px 14px; }
        .ticket-program { font-size:1.15rem; font-weight:bold; color:var(--accent-gray); margin-bottom:5px; }
        .ticket-meta { font-size:0.82rem; color:#999; margin-bottom:2px; }
        .ticket-divider { border:none; border-top:2px dashed #333; margin:0; }
        .ticket-bottom { background:#1a1a1a; border-radius:0 0 16px 16px; padding:12px 16px; display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; }
        .ticket-field { display:flex; flex-direction:column; }
        .ticket-label { font-size:0.68rem; color:#666; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:2px; }
        .ticket-value { font-size:0.88rem; color:#ddd; }
        .ticket-venue { grid-column:1 / -1; }
        .ticket-price-row { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; border-top:1px solid #333; padding-top:8px; margin-top:4px; }
        .ticket-price-label { font-size:0.82rem; color:#888; }
        .ticket-price-value { font-size:1rem; font-weight:bold; color:var(--accent-gray); }

        /* 新增按鈕 */
        .shop-add-card-btn { background:#1a1a1a; border:1px dashed #444; border-radius:16px; color:#666; font-size:1rem; padding:14px; cursor:pointer; text-align:center; width:100%; }
        .shop-add-card-btn:active { background:#252525; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="panel" id="weekPanel">
        <div class="header">
            <button class="btn-sm" onclick="changeWeek(-1)">◀ 上一週</button>
            <div id="weekTitle" onclick="goToday()" style="font-weight:bold; cursor:pointer; flex:1; text-align:center;">WEEK</div>
            <div style="display:flex; gap:6px; align-items:center;">
                <button class="icon-btn" onclick="openSearch()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                <button class="btn-sm" onclick="changeWeek(1)">下一週 ▶</button>
            </div>
        </div>
        <div class="week-grid" id="weekGrid"></div>
    </div>

    <div class="panel" id="listPanel">
        <div class="header">
            <button class="btn-sm" onclick="changeMonth(-1)">◀</button>
            <div id="monthTitle" style="font-weight:bold; cursor:pointer; flex:1; text-align:center;" onclick="goToday()">MONTH</div>
            <div style="display:flex; gap:6px; align-items:center;">
                <button class="icon-btn" onclick="openSearch()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                <button class="btn-sm" onclick="changeMonth(1)">▶</button>
            </div>
        </div>
        <div class="list-view" id="calendarList"></div>
    </div>

    <div class="panel" id="bookmarkPanel">
        <div class="header">
            <span style="font-weight:bold; flex:1;">書籤收藏</span>
            <div style="display:flex; gap:6px; align-items:center;">
                <button class="icon-btn" onclick="openSearch()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                <button class="icon-btn" id="manageBtn" onclick="toggleBookmarkManage()" title="管理分類"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
            </div>
        </div>
        <div id="bookmarkNormalUI" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
            <div class="bookmark-tabs" id="bookmarkTabs"></div>
            <div class="journal-flow" id="bookmarkContent" style="padding:15px;"></div>
            <div class="input-bar">
                <textarea id="bmInput" placeholder="新增書籤內容..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addBookmarkContent();}" oninput="autoResize(this)"></textarea>
                <button class="add-circle" onclick="addBookmarkContent()">+</button>
            </div>
        </div>
        <div id="bookmarkManageUI" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
            <div style="padding:15px 20px 10px; background:#111; border-bottom:1px solid #333; display:flex; gap:8px;">
                <input type="text" id="newCatInput" placeholder="新增分類名稱..." onkeypress="if(event.key==='Enter') addCat()" style="flex:1; background:#2c2c2e; border:none; border-radius:20px; padding:10px 18px; color:white; outline:none; font-size:0.9rem;">
                <button class="add-circle" onclick="addCat()" style="width:38px;height:38px;font-size:1.4rem;">+</button>
            </div>
            <div id="categoryManageList" style="flex:1; overflow-y:auto; padding:15px;"></div>
        </div>
    </div>


    <div class="panel" id="shopPanel">
        <div class="header">
            <span style="font-weight:bold;flex:1;">購物記帳</span>
            <button class="icon-btn" onclick="openSearch()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
        </div>
        <div class="shop-tabs" id="shopTabs"></div>
        <div class="shop-grid" id="shopGrid"></div>
    </div>

    <div class="panel" id="journalPanel">
        <div class="header">
            <div onclick="toggleCalendar()" style="cursor:pointer; flex:1;">
                <span id="activeDateDisplay" style="font-weight:bold;">日期</span> 
                <span id="drawerArrow"> ▼</span>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
                <button class="btn-sm" onclick="goToday()">今天</button>
                <button class="icon-btn" onclick="openSearch()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                <button class="icon-btn" onclick="exportData()" title="匯出"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="8 12 12 8 16 12"/><line x1="12" y1="8" x2="12" y2="17"/></svg></button>
                <button class="icon-btn" onclick="triggerImport()" title="匯入"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="16" x2="12" y2="7"/></svg></button>
                <input type="file" id="importFile" style="display:none" onchange="importJSON(event)">
            </div>
        </div>
        <div class="calendar-drawer collapsed" id="calDrawer">
            <div class="mini-cal-nav" style="display:flex; justify-content:space-between; padding:10px 15px;">
                <button class="btn-sm" onclick="changeDrawerMonth(-1)">◀</button>
                <div id="miniMonthTitle" style="font-weight:bold; cursor:pointer;" onclick="goToday()">MONTH</div>
                <button class="btn-sm" onclick="changeDrawerMonth(1)">▶</button>
            </div>
            <div class="mini-calendar" id="miniCalGrid"></div>
        </div>
        <div class="journal-flow" id="journalFlow"></div>
        <div class="input-bar">
            <input type="time" id="jnTimeInput" style="background:#2c2c2e; border:1px solid #444; color:white; border-radius:12px; padding:8px; width:72px; outline:none; -webkit-appearance:none; appearance:none; text-align:center;">
            <textarea id="jnInput" placeholder="記錄此時此刻..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addJournal();}" oninput="autoResize(this)"></textarea>
            <button class="add-circle" onclick="addJournal()">+</button>
        </div>
    </div>
</div>

<div class="nav-bar">
    <button class="nav-item active" onclick="switchPanel(0)">週曆</button>
    <button class="nav-item" onclick="switchPanel(1)">行事曆</button>
    <button class="nav-item" onclick="switchPanel(2)">書籤</button>
    <button class="nav-item" onclick="switchPanel(3)">購物</button>
    <button class="nav-item" onclick="switchPanel(4)">時間軸</button>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('mega_v14_final_fix')) || {
        calendar: {}, journals: {}, bookmarks: { "我的筆記": [] }, catOrder: ["我的筆記"], shop: []
    };
    if(!db.shop) db.shop = [];
    function save() { localStorage.setItem('mega_v14_final_fix', JSON.stringify(db)); }
    function getDS(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

    let activeDS = getDS(), viewMonth = new Date(), drawerMonth = new Date();
    let isCalExpanded = false, currentCat = db.catOrder[0] || "我的筆記", isManaging = false;
    const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const weekDaysShort = ['日', '一', '二', '三', '四', '五', '六'];

    function switchPanel(idx) {
        if (window.innerWidth < 768) {
            document.getElementById('mainContainer').style.transform = `translateX(-${idx * 100}vw)`;
        } else {
            ['weekPanel', 'listPanel', 'bookmarkPanel', 'shopPanel'].forEach((id, i) => {
                const el = document.getElementById(id);
                if(el) el.classList.toggle('active-left', i === idx);
            });
            if(idx === 4) switchPanel(0);
        }
        document.querySelectorAll('.nav-item').forEach((b, i) => b.classList.toggle('active', i === idx));
        if(idx === 0) renderWeek();
        if(idx === 1) renderList();
        if(idx === 2) renderBookmarkUI();
        if(idx === 3) { renderShopTabs(); renderShop(); }
        if(idx === 4) renderJournals();
    }

    function renderJournals() {
        const flow = document.getElementById('journalFlow'); if(!flow) return; 
        const items = db.journals[activeDS] || [];
        flow.innerHTML = '';
        items.sort((a,b) => a.time.localeCompare(b.time)).forEach((j, i) => {
            flow.innerHTML += `
                <div class="bubble-item">
                    <input type="time" class="time-input" value="${j.time}" onchange="updateJTime(${i}, this.value)">
                    <div class="text-bubble">
                        <div contenteditable="true" onblur="updateJText(${i}, this.innerText)">${j.text}</div>
                        <button class="jn-del-btn" onclick="delJournal(${i})">✕</button>
                    </div>
                </div>`;
        });
        flow.scrollTop = flow.scrollHeight;
        updateInputTime();
    }

    function updateInputTime() {
        const now = new Date();
        const el = document.getElementById('jnTimeInput');
        if(el) el.value = now.toTimeString().slice(0,5);
    }

    function addJournal() {
        const input = document.getElementById('jnInput');
        const timeInput = document.getElementById('jnTimeInput');
        if(!input.value.trim()) return;
        if(!db.journals[activeDS]) db.journals[activeDS] = [];
        db.journals[activeDS].push({ time: timeInput.value || new Date().toTimeString().slice(0,5), text: input.value });
        input.value = ''; input.style.height = '42px'; save(); renderJournals(); updateInputTime();
    }

    // --- 日期與導覽 ---
    function selectDate(ds, autoSwitch = true) {
        activeDS = ds; const d = new Date(ds);
        document.getElementById('activeDateDisplay').innerText = `${d.getMonth()+1}月${d.getDate()}日 週${weekDaysShort[d.getDay()]}`;
        renderWeek(); renderMiniCal(); renderList(); renderJournals();
        if(autoSwitch && window.innerWidth < 768) switchPanel(4);
    }
    function updateCal(date, text) { db.calendar[date] = text; save(); document.querySelectorAll(`.sync-${date}`).forEach(el => el.innerText = text); }
    function changeWeek(dir) { const d = new Date(activeDS); d.setDate(d.getDate() + dir*7); selectDate(getDS(d), false); }
    function changeMonth(dir) { viewMonth.setMonth(viewMonth.getMonth() + dir); renderList(); }
    function changeDrawerMonth(dir) { drawerMonth.setMonth(drawerMonth.getMonth() + dir); renderMiniCal(); }
    function updateJTime(i, v) { db.journals[activeDS][i].time = v; save(); renderJournals(); }
    function updateJText(i, v) { db.journals[activeDS][i].text = v; save(); }
    function delJournal(i) { if(confirm("刪除？")){ db.journals[activeDS].splice(i,1); save(); renderJournals(); }}
    function exportData() { const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Backup.json`; a.click(); }
    function triggerImport() { document.getElementById('importFile').click(); }
    function importJSON(event) { const reader = new FileReader(); reader.onload = function(e) { try { db = JSON.parse(e.target.result); save(); location.reload(); } catch (err) { alert("失敗"); } }; reader.readAsText(event.target.files[0]); }
    
    function goToday() { 
        const today = new Date(); viewMonth = new Date(today); drawerMonth = new Date(today); 
        selectDate(getDS(today), false); 
        setTimeout(() => {
            const el = document.getElementById(`list-${getDS(today)}`);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    function toggleCalendar() {
        isCalExpanded = !isCalExpanded;
        const drawer = document.getElementById('calDrawer');
        drawer.classList.toggle('expanded', isCalExpanded);
        drawer.classList.toggle('collapsed', !isCalExpanded);
        document.getElementById('drawerArrow').innerText = isCalExpanded ? " ▲" : " ▼";
        renderMiniCal();
    }

    function renderMiniCal() {
        const grid = document.getElementById('miniCalGrid'); if(!grid) return; grid.innerHTML = '';
        ['一','二','三','四','五','六','日'].forEach(l => grid.innerHTML += `<div style="font-size:0.75rem; color:#888;">${l}</div>`);
        const y = drawerMonth.getFullYear(), m = drawerMonth.getMonth();
        document.getElementById('miniMonthTitle').innerText = `${monthNames[m]} ${y}`;
        if (isCalExpanded) {
            let firstDay = new Date(y, m, 1).getDay(); firstDay = (firstDay === 0) ? 6 : firstDay - 1; 
            const lastDate = new Date(y, m+1, 0).getDate();
            for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;
            for(let d=1; d<=lastDate; d++) {
                const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                grid.innerHTML += `<div class="cal-date ${ds===activeDS?'selected':''} ${ (new Date(ds).getDay()===0||new Date(ds).getDay()===6)?'is-weekend':''}" onclick="selectDate('${ds}')">${d}</div>`;
            }
        } else {
            const curr = new Date(activeDS); const diff = (curr.getDay() === 0 ? -6 : 1 - curr.getDay());
            const start = new Date(curr); start.setDate(curr.getDate() + diff);
            for(let i=0; i<7; i++) {
                const d = new Date(start); d.setDate(start.getDate() + i); const ds = getDS(d);
                grid.innerHTML += `<div class="cal-date ${ds===activeDS?'selected':''} ${ (d.getDay()===0||d.getDay()===6)?'is-weekend':''}" onclick="selectDate('${ds}')">${d.getDate()}</div>`;
            }
        }
    }

    function renderWeek() {
        const grid = document.getElementById('weekGrid'); if(!grid) return; grid.innerHTML = '';
        const curr = new Date(activeDS); const day = curr.getDay();
        const diff = (day === 0 ? -6 : 1 - day);
        const start = new Date(curr); start.setDate(curr.getDate() + diff);
        document.getElementById('weekTitle').innerText = `${start.getFullYear()} / ${start.getMonth()+1}月`;
        for(let i=0; i<7; i++) {
            const d = new Date(start); d.setDate(start.getDate() + i); const ds = getDS(d);
            grid.innerHTML += `<div class="week-card ${ds===getDS(new Date())?'today':''}">
                <div class="week-day-title" onclick="selectDate('${ds}')">
                    <span style="color:${(d.getDay()===0||d.getDay()===6)?'var(--accent-red)':'white'}">${d.getMonth()+1}/${d.getDate()} (${weekDaysShort[d.getDay()]})</span>
                </div>
                <div class="week-day-content sync-${ds}" contenteditable="true" onblur="updateCal('${ds}', this.innerText)">${db.calendar[ds]||''}</div>
            </div>`;
        }
    }

    function renderList() {
        const list = document.getElementById('calendarList'); if(!list) return; list.innerHTML = '';
        const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
        document.getElementById('monthTitle').innerText = `${monthNames[m]} ${y}`;
        const lastDay = new Date(y, m+1, 0).getDate();
        for(let d=1; d<=lastDay; d++) {
            const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isWeekend = (new Date(ds).getDay()===0||new Date(ds).getDay()===6);
            list.innerHTML += `<div class="day-row ${ds === activeDS?'selected':''}" id="list-${ds}">
                <div class="day-num-box" onclick="selectDate('${ds}', false)">
                    <div class="day-num ${isWeekend?'is-weekend-text':''}">${d}</div>
                    <div class="day-weekday ${isWeekend?'is-weekend-text':''}">${weekDaysShort[new Date(ds).getDay()]}</div>
                </div>
                <div class="day-content sync-${ds}" contenteditable="true" onblur="updateCal('${ds}', this.innerText)">${db.calendar[ds]||''}</div>
            </div>`;
        }
    }

    function linkify(text) {
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const parts = text.split(urlRegex);
        const frag = document.createDocumentFragment();
        parts.forEach(part => {
            if (/^https?:\/\//.test(part)) {
                const a = document.createElement('a');
                a.href = part;
                a.textContent = part;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.style.cssText = 'color:#64b5f6;word-break:break-all;text-decoration:none;border-bottom:1px solid rgba(100,181,246,0.35);';
                frag.appendChild(a);
            } else if (part) {
                frag.appendChild(document.createTextNode(part));
            }
        });
        return frag;
    }

    function renderBookmarkUI() {
        if(isManaging) { renderManageUI(); return; }
        const tabs = document.getElementById('bookmarkTabs'); if(!tabs) return;
        tabs.innerHTML = '';
        db.catOrder.forEach(cat => {
            tabs.innerHTML += `<button class="btn-sm" style="white-space:nowrap; border-radius:20px; ${currentCat===cat?'background:var(--accent-gray);color:black':''}" onclick="currentCat='${cat}';renderBookmarkUI()">${cat}</button>`;
        });
        const content = document.getElementById('bookmarkContent'); if(!content) return;
        content.innerHTML = '';
        (db.bookmarks[currentCat] || []).forEach((b, i) => {
            const item = document.createElement('div');
            item.className = 'bookmark-item';
            const delBtn = document.createElement('button');
            delBtn.className = 'bm-del-btn';
            delBtn.textContent = '✕';
            delBtn.onclick = () => delBookmarkItem(i);
            const textDiv = document.createElement('div');
            textDiv.className = 'bm-text';
            textDiv.appendChild(linkify(b.text));
            const dateSpan = document.createElement('span');
            dateSpan.className = 'bm-date';
            dateSpan.textContent = b.date || '';
            item.appendChild(delBtn);
            item.appendChild(textDiv);
            item.appendChild(dateSpan);
            content.appendChild(item);
        });
        content.scrollTop = content.scrollHeight;
    }

    function toggleBookmarkManage() {
        isManaging = !isManaging;
        document.getElementById('bookmarkNormalUI').style.display = isManaging ? 'none' : 'flex';
        document.getElementById('bookmarkManageUI').style.display = isManaging ? 'flex' : 'none';
        document.getElementById('manageBtn').innerHTML = isManaging ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
        if(isManaging) renderManageUI(); else renderBookmarkUI();
    }

    function renderManageUI() {
        const list = document.getElementById('categoryManageList'); 
        if(!list) return;
        list.innerHTML = '';
        db.catOrder.forEach((cat, idx) => {
            const isFirst = idx === 0, isLast = idx === db.catOrder.length - 1;
            list.innerHTML += `
            <div style="display:flex; align-items:center; gap:8px; background:#252525; padding:10px 12px; border-radius:10px; margin-bottom:10px; border:1px solid #333;">
                <div style="display:flex; flex-direction:column; gap:2px;">
                    <button onclick="moveCat(${idx},-1)" style="background:none;border:none;color:${isFirst?'#444':'#aaa'};font-size:0.8rem;cursor:pointer;padding:2px 5px;line-height:1;" ${isFirst?'disabled':''}>▲</button>
                    <button onclick="moveCat(${idx},1)" style="background:none;border:none;color:${isLast?'#444':'#aaa'};font-size:0.8rem;cursor:pointer;padding:2px 5px;line-height:1;" ${isLast?'disabled':''}>▼</button>
                </div>
                <input type="text" value="${cat}" style="flex:1; background:transparent; border:1px solid #444; color:white; padding:7px 10px; border-radius:6px; font-size:0.9rem; outline:none;" onchange="renameCat(${idx}, this.value)">
                <button onclick="deleteCat(${idx})" style="background:none;border:none;color:#ff453a;font-size:1.1rem;cursor:pointer;padding:4px 6px;">🗑️</button>
            </div>`;
        });
    }

    function addCat() {
        const input = document.getElementById('newCatInput');
        const name = input.value.trim();
        if(!name) return;
        if(db.catOrder.includes(name)) { alert("分類名稱已存在"); return; }
        db.catOrder.push(name);
        if(!db.bookmarks[name]) db.bookmarks[name] = [];
        input.value = '';
        save(); renderManageUI();
    }

    function renameCat(idx, newName) {
        newName = newName.trim();
        if(!newName) return;
        const old = db.catOrder[idx];
        if(old === newName) return;
        if(db.catOrder.includes(newName)) { alert("名稱已存在"); renderManageUI(); return; }
        db.catOrder[idx] = newName;
        db.bookmarks[newName] = db.bookmarks[old] || [];
        delete db.bookmarks[old];
        if(currentCat === old) currentCat = newName;
        save(); renderManageUI();
    }

    function deleteCat(idx) {
        const cat = db.catOrder[idx];
        const count = (db.bookmarks[cat] || []).length;
        if(count > 0 && !confirm(`「${cat}」含有 ${count} 筆書籤，確定刪除？`)) return;
        if(count === 0 && !confirm(`刪除分類「${cat}」？`)) return;
        db.catOrder.splice(idx, 1);
        delete db.bookmarks[cat];
        if(currentCat === cat) currentCat = db.catOrder[0] || '';
        save(); renderManageUI();
    }

    function moveCat(idx, dir) {
        const newIdx = idx + dir;
        if(newIdx < 0 || newIdx >= db.catOrder.length) return;
        [db.catOrder[idx], db.catOrder[newIdx]] = [db.catOrder[newIdx], db.catOrder[idx]];
        save(); renderManageUI();
    }

    function addBookmarkContent() {
        const input = document.getElementById('bmInput'); if(!input.value.trim() || !currentCat) return;
        if(!db.bookmarks[currentCat]) db.bookmarks[currentCat] = [];
        db.bookmarks[currentCat].push({ date: new Date().toLocaleDateString(), text: input.value });
        input.value = ''; input.style.height = '42px'; save(); renderBookmarkUI();
    }
    function delBookmarkItem(idx) { if(confirm("刪除內容？")) { db.bookmarks[currentCat].splice(idx, 1); save(); renderBookmarkUI(); }}


    // ===== 搜尋功能 =====
    let searchItems = [];

    function openSearch() {
        document.getElementById('searchOverlay').classList.add('open');
        setTimeout(() => document.getElementById('searchInput').focus(), 300);
    }

    function closeSearch() {
        document.getElementById('searchOverlay').classList.remove('open');
        document.getElementById('searchInput').value = '';
        document.getElementById('searchResults').innerHTML = '<div class="search-empty">輸入關鍵字開始搜尋</div>';
    }

    function highlight(text, kw) {
        const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return text.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
    }

    function doSearch(kw) {
        const results = document.getElementById('searchResults');
        kw = kw.trim();
        if (!kw) {
            results.innerHTML = '<div class="search-empty">輸入關鍵字開始搜尋</div>';
            return;
        }
        const kwLower = kw.toLowerCase();
        searchItems = [];

        // 時間軸
        Object.entries(db.journals).forEach(([date, entries]) => {
            (entries || []).forEach(j => {
                if (j.text.toLowerCase().includes(kwLower)) {
                    searchItems.push({
                        type: '時間軸', date, text: j.text, meta: j.time + '　' + date,
                        action: () => {
                            closeSearch();
                            const d = new Date(date);
                            viewMonth = new Date(d); drawerMonth = new Date(d);
                            selectDate(date, false);
                            switchPanel(4);
                            setTimeout(() => {
                                const flow = document.getElementById('journalFlow');
                                if (flow) flow.scrollTop = 0;
                            }, 200);
                        }
                    });
                }
            });
        });

        // 行事曆
        Object.entries(db.calendar).forEach(([date, text]) => {
            if (text && text.toLowerCase().includes(kwLower)) {
                searchItems.push({
                    type: '行事曆', date, text, meta: date,
                    action: () => {
                        closeSearch();
                        const d = new Date(date);
                        viewMonth = new Date(d);
                        selectDate(date, false);
                        switchPanel(1);
                        setTimeout(() => {
                            const el = document.getElementById('list-' + date);
                            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 200);
                    }
                });
            }
        });

        // 書籤
        db.catOrder.forEach(cat => {
            (db.bookmarks[cat] || []).forEach(b => {
                if (b.text.toLowerCase().includes(kwLower)) {
                    searchItems.push({
                        type: '書籤・' + cat, date: b.date || '', text: b.text, meta: b.date || '',
                        action: () => {
                            closeSearch();
                            currentCat = cat;
                            switchPanel(2);
                        }
                    });
                }
            });
        });

        searchItems.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

        if (searchItems.length === 0) {
            results.innerHTML = '<div class="search-empty">找不到相關結果</div>';
            return;
        }

        results.innerHTML = searchItems.map((item, idx) => {
            const safeText = item.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            return `<div class="search-result-item" onclick="searchItems[${idx}].action()">
                <div class="search-result-source">${item.type}</div>
                <div class="search-result-text">${highlight(safeText, kw)}</div>
                <div class="search-result-meta">${item.meta}</div>
            </div>`;
        }).join('');
    }


    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }


    // ═══════════════ 購物記帳 ═══════════════
    const shopCats = ['全部', '3C', '衣物', '鞋包', '表演', '其他'];
    const currencies = { 'TWD': 'NT$', 'JPY': '¥', 'KRW': '₩', 'USD': '$' };
    let currentShopCat = '全部';

    function fmtPrice(currency, price) {
        const sym = currencies[currency] || currency;
        const num = parseFloat(price);
        if(isNaN(num)) return sym + '0';
        return sym + num.toLocaleString();
    }

    function renderShopTabs() {
        const el = document.getElementById('shopTabs'); if(!el) return;
        el.innerHTML = shopCats.map(cat =>
            `<button class="shop-tab ${currentShopCat===cat?'active':''}" onclick="currentShopCat='${cat}';renderShopTabs();renderShop()">${cat}</button>`
        ).join('');
    }

    function getShopSortDate(card) {
        return card.category === '表演' ? (card.perfDate || card.date || '') : (card.date || '');
    }

    function renderShop() {
        const grid = document.getElementById('shopGrid'); if(!grid) return;
        let cards = currentShopCat === '全部'
            ? [...db.shop]
            : db.shop.filter(c => c.category === currentShopCat);
        cards.sort((a,b) => getShopSortDate(a).localeCompare(getShopSortDate(b)));
        grid.innerHTML = '';
        cards.forEach(card => {
            const div = document.createElement('div');
            div.setAttribute('data-card-id', card.id);
            if(!card.published) {
                div.innerHTML = buildEditCard(card);
            } else {
                div.innerHTML = card.category === '表演' ? buildTicketCard(card) : buildViewCard(card);
            }
            grid.appendChild(div);
        });
        // 新增按鈕
        const addBtn = document.createElement('button');
        addBtn.className = 'shop-add-card-btn';
        addBtn.textContent = '＋ 新增記帳';
        addBtn.onclick = addShopCard;
        grid.appendChild(addBtn);
        grid.scrollTop = grid.scrollHeight;
    }

    function buildEditCard(card) {
        const isPerf = card.category === '表演';
        const headerNote = `<input class="shop-card-title" placeholder="${isPerf ? '備注' : '備注（地點、用途）'}" value="${escHtml(card.title||'')}">`;
        const currSel = `<select class="shop-currency-select">${['TWD','JPY','KRW','USD'].map(c=>`<option value="${c}" ${card.currency===c?'selected':''}>${c}</option>`).join('')}</select>`;

        if(isPerf) {
            return `<div class="shop-card-edit">
                <div class="shop-card-header">${headerNote}${currSel}</div>
                <input class="perf-field perf-program" placeholder="節目名稱" value="${escHtml(card.program||'')}">
                <div class="perf-row">
                    <input type="date" class="perf-field perf-perfdate" value="${card.perfDate||''}">
                    <input type="time" class="perf-field perf-perftime" value="${card.perfTime||''}">
                </div>
                <input class="perf-field perf-zone" placeholder="票價區域（如：A區）" value="${escHtml(card.zone||'')}">
                <input class="perf-field perf-seat" placeholder="座位（如：3排5號）" value="${escHtml(card.seat||'')}">
                <input class="perf-field perf-venue" placeholder="場地" value="${escHtml(card.venue||'')}">
                <input type="date" class="shop-date-input" placeholder="購買日期" value="${card.date||''}">
                <input type="number" class="perf-price-input perf-price" placeholder="票價" value="${escHtml(card.price||'')}">
                <button class="shop-publish-btn" onclick="publishShopCard(${card.id})">發佈</button>
            </div>`;
        } else {
            const rows = (card.items||[{name:'',price:''}]).map((it,i) =>
                `<div class="shop-item-row">
                    <input class="shop-item-name" placeholder="商品名稱" value="${escHtml(it.name||'')}">
                    <input class="shop-item-price" placeholder="0" type="number" value="${escHtml(it.price||'')}">
                    <button class="shop-item-del" onclick="delShopItemDirect(${card.id},${i})">✕</button>
                </div>`).join('');
            return `<div class="shop-card-edit">
                <div class="shop-card-header">
                    <input type="date" class="shop-date-input" style="width:auto;flex:1;" value="${card.date||''}">
                    ${headerNote}${currSel}
                </div>
                ${rows}
                <button class="shop-add-item-btn" onclick="addShopItemDirect(${card.id})">＋ 新增商品</button>
                <button class="shop-publish-btn" onclick="publishShopCard(${card.id})">發佈</button>
            </div>`;
        }
    }

    function buildViewCard(card) {
        const sym = currencies[card.currency] || 'NT$';
        const items = card.items || [];
        const total = items.reduce((s,it) => s + (parseFloat(it.price)||0), 0);
        const rows = items.map(it =>
            `<div class="shop-item-line"><span>${escHtml(it.name)}</span><span>${sym}${(parseFloat(it.price)||0).toLocaleString()}</span></div>`
        ).join('');
        return `<div class="shop-card-view" onclick="editShopCard(${card.id})">
            <button class="shop-card-del" onclick="event.stopPropagation();delShopCard(${card.id})">✕</button>
            <div class="shop-badge">${escHtml(card.category)}</div>
            <div class="shop-card-meta">${card.date||''}　${card.currency}</div>
            ${card.title ? `<div class="shop-card-titletext">${escHtml(card.title)}</div>` : ''}
            <hr class="shop-divider">
            ${rows}
            <div class="shop-item-line total"><span>合計</span><span>${sym}${total.toLocaleString()}</span></div>
        </div>`;
    }

    function buildTicketCard(card) {
        const sym = currencies[card.currency] || 'NT$';
        const price = parseFloat(card.price)||0;
        const titleNote = card.title ? `<div class="ticket-meta">${escHtml(card.title)}</div>` : '';
        return `<div class="ticket-card" onclick="editShopCard(${card.id})" data-card-id="${card.id}">
            <button class="shop-card-del" onclick="event.stopPropagation();delShopCard(${card.id})">✕</button>
            <div class="ticket-top">
                <div class="ticket-program">${escHtml(card.program||'（未填節目）')}</div>
                <div class="ticket-meta">${card.perfDate||''} ${card.perfTime||''}</div>
                ${titleNote}
            </div>
            <hr class="ticket-divider">
            <div class="ticket-bottom">
                <div class="ticket-field">
                    <span class="ticket-label">票價區域</span>
                    <span class="ticket-value">${escHtml(card.zone||'—')}</span>
                </div>
                <div class="ticket-field">
                    <span class="ticket-label">座位</span>
                    <span class="ticket-value">${escHtml(card.seat||'—')}</span>
                </div>
                <div class="ticket-field ticket-venue">
                    <span class="ticket-label">場地</span>
                    <span class="ticket-value">${escHtml(card.venue||'—')}</span>
                </div>
                <div class="ticket-field ticket-venue">
                    <span class="ticket-label">購買日期</span>
                    <span class="ticket-value">${card.date||'—'}</span>
                </div>
                <div class="ticket-price-row">
                    <span class="ticket-price-label">票價</span>
                    <span class="ticket-price-value">${sym}${price.toLocaleString()}</span>
                </div>
            </div>
        </div>`;
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function syncCardFromDOM(card) {
        const el = document.querySelector(`[data-card-id="${card.id}"]`);
        if(!el) return;
        const titleEl = el.querySelector('.shop-card-title');
        if(titleEl) card.title = titleEl.value;
        const curEl = el.querySelector('.shop-currency-select');
        if(curEl) card.currency = curEl.value;
        if(card.category === '表演') {
            card.date     = el.querySelector('.shop-date-input')?.value || card.date;
            card.perfDate = el.querySelector('.perf-perfdate')?.value || '';
            card.perfTime = el.querySelector('.perf-perftime')?.value || '';
            card.program  = el.querySelector('.perf-program')?.value || '';
            card.zone     = el.querySelector('.perf-zone')?.value || '';
            card.venue    = el.querySelector('.perf-venue')?.value || '';
            card.seat     = el.querySelector('.perf-seat')?.value || '';
            card.price    = el.querySelector('.perf-price')?.value || '';
        } else {
            card.date = el.querySelector('.shop-date-input')?.value || card.date;
            card.items = [];
            el.querySelectorAll('.shop-item-row').forEach(row => {
                const name = row.querySelector('.shop-item-name')?.value || '';
                const price = row.querySelector('.shop-item-price')?.value || '';
                if(name || price) card.items.push({ name, price });
            });
        }
    }

    function addShopCard() {
        const isPerf = currentShopCat === '表演';
        const cat = (currentShopCat === '全部') ? '其他' : currentShopCat;
        const card = {
            id: Date.now(),
            date: getDS(),
            title: '',
            currency: 'TWD',
            category: cat,
            published: false,
            items: isPerf ? undefined : [{ name:'', price:'' }],
            ...(isPerf ? { perfDate:'', perfTime:'', program:'', zone:'', seat:'', venue:'', price:'' } : {})
        };
        db.shop.push(card);
        save();
        renderShop();
    }

    function publishShopCard(id) {
        const card = db.shop.find(c => c.id === id);
        if(!card) return;
        syncCardFromDOM(card);
        card.published = true;
        save(); renderShop();
    }

    function editShopCard(id) {
        const card = db.shop.find(c => c.id === id);
        if(!card) return;
        card.published = false;
        save(); renderShop();
    }

    function delShopCard(id) {
        if(!confirm('確定刪除這筆記帳？')) return;
        db.shop = db.shop.filter(c => c.id !== id);
        save(); renderShop();
    }

    function addShopItemDirect(id) {
        const card = db.shop.find(c => c.id === id);
        if(!card) return;
        syncCardFromDOM(card);
        card.items.push({ name:'', price:'' });
        save(); renderShop();
    }

    function delShopItemDirect(id, idx) {
        const card = db.shop.find(c => c.id === id);
        if(!card) return;
        syncCardFromDOM(card);
        card.items.splice(idx, 1);
        if(card.items.length === 0) card.items.push({ name:'', price:'' });
        save(); renderShop();
    }

    window.onload = () => { 
        goToday(); 
        renderShopTabs(); renderShop();
        if(window.innerWidth >= 768) switchPanel(0); 
        else switchPanel(0);
        updateInputTime();
        setInterval(() => { if(document.activeElement !== document.getElementById('jnTimeInput')) updateInputTime(); }, 60000);
    };
</script>

        <button class="search-cancel" onclick="closeSearch()">取消</button>
    </div>
    <div class="search-results" id="searchResults">
        <div class="search-empty">輸入關鍵字開始搜尋</div>
