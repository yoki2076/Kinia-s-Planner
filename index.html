<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kinia's Planner v2</title>

    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root {
            --bg-dark: #121212;
            --header-black: #000000;
            --card-dark: #1e1e1e;
            --text-gray: #b0b0b0;
            --accent-gray: #e0e0e0;
            --accent-red: #ff453a;
            --border: #333;
            --input-bg: #2c2c2e;
            --bm-card: #252525;
        }

        * {
            font-family: "HanziPen TC-Bold", "HanziPen TC", "Apple LiGothic", "Microsoft JhengHei", sans-serif;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-dark);
            color: white; 
            overflow: hidden;
        }

        /* 容器與面板基礎設定 */
        .container { 
            display: flex; 
            height: calc(100vh - 60px); 
            width: 400vw; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            position: fixed;
            top: 0;
            left: 0;
        }
        .panel { 
            width: 100vw; 
            height: 100%; 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            border-right: 1px solid var(--border); 
        }

        .header { 
            background-color: var(--header-black); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 15px; border-bottom: 1px solid var(--border); height: 60px; 
        }

        .btn-sm { background: #252525; color: white; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }

        /* --- 時間軸區域排版優化 --- */
        .journal-flow { flex: 1; overflow-y: auto; padding: 20px; }
        .bubble-item { display: flex; gap: 12px; margin-bottom: 15px; align-items: center; }
        
        /* 統一時間輸入框樣式，隱藏時鐘圖示 */
        .time-input { 
            background: #252525; border: 1px solid rgba(176,176,176,0.3); color: var(--text-gray); 
            border-radius: 8px; padding: 6px 8px; font-size: 0.85rem; outline: none; 
            width: 72px; -webkit-appearance: none; appearance: none; text-align: center;
        }
        .time-input::-webkit-calendar-picker-indicator { 
            display: none;
        }
        
        .text-bubble { 
            background: #2c2c2e; padding: 12px 16px; border-radius: 18px; 
            flex: 1; display: flex; align-items: center; gap: 10px; position: relative; color: white; min-height: 44px;
        }
        .text-bubble div[contenteditable="true"] { flex: 1; outline: none; word-break: break-all; cursor: text; line-height: 1.4; }
        .jn-del-btn { background: none; border: none; color: #888; font-size: 1.1rem; cursor: pointer; padding: 0 5px; display: flex; align-items: center; }

        /* 輸入列佈局 */
        .input-bar { 
            padding: 12px; background: #000; border-top: 1px solid var(--border); 
            display: flex; gap: 8px; align-items: center; 
            position: relative; z-index: 10;
        }
        /* 底部輸入列時間欄位，隱藏時鐘圖示 */
        #jnTimeInput::-webkit-calendar-picker-indicator {
            display: none;
        }

        .input-bar input[type="text"] { 
            flex: 1; background: #2c2c2e; border: none; border-radius: 20px; 
            padding: 10px 18px; color: white; outline: none; 
        }
        .add-circle { 
            background: var(--accent-gray); color: black; width: 42px; height: 42px; 
            border-radius: 50%; border: none; font-size: 1.6rem; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; 
        }

        /* 書籤樣式 */
        .bookmark-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px; background: #1a1a1a; border-bottom: 1px solid #333; scrollbar-width: none; }
        .bookmark-item { background: var(--bm-card); border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid #333; border-left: 4px solid var(--accent-gray); position: relative; }
        .bm-text { font-size: 1rem; color: #eee; line-height: 1.6; margin-bottom: 8px; word-break: break-word; white-space: pre-wrap; }
        .bm-date { font-size: 0.75rem; color: #666; text-align: right; display: block; }
        .bm-del-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #555; cursor: pointer; }

        /* 行事曆與週曆 */
        .list-view { flex: 1; overflow-y: auto; scroll-behavior: smooth; background: var(--bg-dark); }
        .day-row { display: flex; border-bottom: 1px solid var(--border); min-height: 80px; align-items: stretch; }
        .day-row.selected { background: #1a1a1a; border-left: 4px solid var(--accent-gray); }
        .day-num-box { width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--border); background: rgba(255,255,255,0.02); cursor: pointer; }
        .day-num { font-size: 1.3rem; font-weight: bold; }
        .day-weekday { font-size: 0.75rem; }
        .day-content { flex: 1; padding: 15px; outline: none; white-space: pre-wrap; color: #efefef; line-height: 1.4; cursor: text; }
        .is-weekend-text { color: var(--accent-red) !important; }

        .week-grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 15px; overflow-y: auto; }
        .week-card { background: var(--card-dark); border-radius: 12px; padding: 15px; border: 1px solid #333; }
        .week-card.today { border: 2px solid var(--accent-gray); }
        .week-day-title { font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .week-day-content { font-size: 0.95rem; color: #efefef; min-height: 2.5em; outline: none; white-space: pre-wrap; background: var(--input-bg); border-radius: 8px; padding: 10px; border: 1px solid transparent; cursor: text; }

        /* 抽屜導覽 */
        .calendar-drawer { background: #1a1a1a; border-bottom: 1px solid var(--border); overflow: hidden; transition: max-height 0.3s ease; }
        .calendar-drawer.expanded { max-height: 500px; padding-bottom: 15px; }
        .calendar-drawer.collapsed { max-height: 140px; }
        .mini-calendar { padding: 10px 5px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .cal-date { padding: 8px 0; border-radius: 6px; cursor: pointer; font-size: 0.9rem; width: 85%; margin: 0 auto; }
        .cal-date.selected { background: var(--accent-gray); color: #000; font-weight: bold; }
        .cal-date.is-weekend { color: var(--accent-red); }

        /* 導覽列 */
        .nav-bar { position: fixed; bottom: 0; width: 100vw; height: 60px; background: #000; border-top: 1px solid var(--border); display: flex; z-index: 1000; }
        .nav-item { flex: 1; border: none; background: none; color: var(--text-gray); font-size: 0.9rem; cursor: pointer; }
        .nav-item.active { color: white; font-weight: bold; }

        /* 桌面端響應式 */
        @media (min-width: 768px) {
            .container { width: 100vw; height: 100vh; transform: none !important; position: static; }
            .panel { width: 35%; height: calc(100vh - 60px); }
            #journalPanel { width: 65%; display: flex !important; }
            #weekPanel, #listPanel, #bookmarkPanel { display: none; }
            #weekPanel.active-left, #listPanel.active-left, #bookmarkPanel.active-left { display: flex; }
            .nav-bar { width: 35%; }
            .nav-item:nth-child(4) { display: none; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="panel" id="weekPanel">
        <div class="header">
            <button class="btn-sm" onclick="changeWeek(-1)">◀ 上一週</button>
            <div id="weekTitle" onclick="goToday()" style="font-weight:bold; cursor:pointer;">WEEK</div>
            <button class="btn-sm" onclick="changeWeek(1)">下一週 ▶</button>
        </div>
        <div class="week-grid" id="weekGrid"></div>
    </div>

    <div class="panel" id="listPanel">
        <div class="header">
            <button class="btn-sm" onclick="changeMonth(-1)">◀</button>
            <div id="monthTitle" style="font-weight:bold; cursor:pointer;" onclick="goToday()">MONTH</div>
            <button class="btn-sm" onclick="changeMonth(1)">▶</button>
        </div>
        <div class="list-view" id="calendarList"></div>
    </div>

    <div class="panel" id="bookmarkPanel">
        <div class="header">
            <span style="font-weight:bold;">書籤收藏</span>
            <button class="btn-sm" id="manageBtn" onclick="toggleBookmarkManage()">⚙️ 管理</button>
        </div>
        <div id="bookmarkNormalUI" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
            <div class="bookmark-tabs" id="bookmarkTabs"></div>
            <div class="journal-flow" id="bookmarkContent" style="padding:15px;"></div>
            <div class="input-bar">
                <input type="text" id="bmInput" placeholder="新增書籤內容..." onkeypress="if(event.key==='Enter') addBookmarkContent()">
                <button class="add-circle" onclick="addBookmarkContent()">+</button>
            </div>
        </div>
        <div id="bookmarkManageUI" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
            <div style="padding:15px 20px 10px; background:#111; border-bottom:1px solid #333; display:flex; gap:8px;">
                <input type="text" id="newCatInput" placeholder="新增分類名稱..." onkeypress="if(event.key==='Enter') addCat()" style="flex:1; background:#2c2c2e; border:none; border-radius:20px; padding:10px 18px; color:white; outline:none; font-size:0.9rem;">
                <button class="add-circle" onclick="addCat()" style="width:38px;height:38px;font-size:1.4rem;">+</button>
            </div>
            <div id="categoryManageList" style="flex:1; overflow-y:auto; padding:15px;"></div>
        </div>
    </div>

    <div class="panel" id="journalPanel">
        <div class="header">
            <div onclick="toggleCalendar()" style="cursor:pointer; flex:1;">
                <span id="activeDateDisplay" style="font-weight:bold;">日期</span> 
                <span id="drawerArrow"> ▼</span>
            </div>
            <div style="display:flex; gap:5px;">
                <button class="btn-sm" onclick="goToday()">今天</button>
                <button class="btn-sm" onclick="exportData()">📤</button>
                <button class="btn-sm" onclick="triggerImport()">📥</button>
                <input type="file" id="importFile" style="display:none" onchange="importJSON(event)">
            </div>
        </div>
        <div class="calendar-drawer collapsed" id="calDrawer">
            <div class="mini-cal-nav" style="display:flex; justify-content:space-between; padding:10px 15px;">
                <button class="btn-sm" onclick="changeDrawerMonth(-1)">◀</button>
                <div id="miniMonthTitle" style="font-weight:bold; cursor:pointer;" onclick="goToday()">MONTH</div>
                <button class="btn-sm" onclick="changeDrawerMonth(1)">▶</button>
            </div>
            <div class="mini-calendar" id="miniCalGrid"></div>
        </div>
        <div class="journal-flow" id="journalFlow"></div>
        <div class="input-bar">
            <input type="time" id="jnTimeInput" style="background:#2c2c2e; border:1px solid #444; color:white; border-radius:12px; padding:8px; width:72px; outline:none; -webkit-appearance:none; appearance:none; text-align:center;">
            <input type="text" id="jnInput" placeholder="記錄此時此刻..." onkeypress="if(event.key==='Enter') addJournal()">
            <button class="add-circle" onclick="addJournal()">+</button>
        </div>
    </div>
</div>

<div class="nav-bar">
    <button class="nav-item active" onclick="switchPanel(0)">週曆</button>
    <button class="nav-item" onclick="switchPanel(1)">行事曆</button>
    <button class="nav-item" onclick="switchPanel(2)">書籤</button>
    <button class="nav-item" onclick="switchPanel(3)">時間軸</button>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('mega_v14_final_fix')) || {
        calendar: {}, journals: {}, bookmarks: { "我的筆記": [] }, catOrder: ["我的筆記"]
    };
    function save() { localStorage.setItem('mega_v14_final_fix', JSON.stringify(db)); }
    function getDS(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

    let activeDS = getDS(), viewMonth = new Date(), drawerMonth = new Date();
    let isCalExpanded = false, currentCat = db.catOrder[0] || "我的筆記", isManaging = false;
    const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const weekDaysShort = ['日', '一', '二', '三', '四', '五', '六'];

    function switchPanel(idx) {
        if (window.innerWidth < 768) {
            document.getElementById('mainContainer').style.transform = `translateX(-${idx * 100}vw)`;
        } else {
            ['weekPanel', 'listPanel', 'bookmarkPanel'].forEach((id, i) => {
                const el = document.getElementById(id);
                if(el) el.classList.toggle('active-left', i === idx);
            });
            if(idx === 3) switchPanel(0);
        }
        document.querySelectorAll('.nav-item').forEach((b, i) => b.classList.toggle('active', i === idx));
        if(idx === 0) renderWeek();
        if(idx === 1) renderList();
        if(idx === 2) renderBookmarkUI();
        if(idx === 3) renderJournals();
    }

    function renderJournals() {
        const flow = document.getElementById('journalFlow'); if(!flow) return; 
        const items = db.journals[activeDS] || [];
        flow.innerHTML = '';
        items.sort((a,b) => a.time.localeCompare(b.time)).forEach((j, i) => {
            flow.innerHTML += `
                <div class="bubble-item">
                    <input type="time" class="time-input" value="${j.time}" onchange="updateJTime(${i}, this.value)">
                    <div class="text-bubble">
                        <div contenteditable="true" onblur="updateJText(${i}, this.innerText)">${j.text}</div>
                        <button class="jn-del-btn" onclick="delJournal(${i})">✕</button>
                    </div>
                </div>`;
        });
        flow.scrollTop = flow.scrollHeight;
        updateInputTime();
    }

    function updateInputTime() {
        const now = new Date();
        const el = document.getElementById('jnTimeInput');
        if(el) el.value = now.toTimeString().slice(0,5);
    }

    function addJournal() {
        const input = document.getElementById('jnInput');
        const timeInput = document.getElementById('jnTimeInput');
        if(!input.value.trim()) return;
        if(!db.journals[activeDS]) db.journals[activeDS] = [];
        db.journals[activeDS].push({ time: timeInput.value || new Date().toTimeString().slice(0,5), text: input.value });
        input.value = ''; save(); renderJournals(); updateInputTime();
    }

    // --- 日期與導覽 ---
    function selectDate(ds, autoSwitch = true) {
        activeDS = ds; const d = new Date(ds);
        document.getElementById('activeDateDisplay').innerText = `${d.getMonth()+1}月${d.getDate()}日 週${weekDaysShort[d.getDay()]}`;
        renderWeek(); renderMiniCal(); renderList(); renderJournals();
        if(autoSwitch && window.innerWidth < 768) switchPanel(3);
    }
    function updateCal(date, text) { db.calendar[date] = text; save(); document.querySelectorAll(`.sync-${date}`).forEach(el => el.innerText = text); }
    function changeWeek(dir) { const d = new Date(activeDS); d.setDate(d.getDate() + dir*7); selectDate(getDS(d), false); }
    function changeMonth(dir) { viewMonth.setMonth(viewMonth.getMonth() + dir); renderList(); }
    function changeDrawerMonth(dir) { drawerMonth.setMonth(drawerMonth.getMonth() + dir); renderMiniCal(); }
    function updateJTime(i, v) { db.journals[activeDS][i].time = v; save(); renderJournals(); }
    function updateJText(i, v) { db.journals[activeDS][i].text = v; save(); }
    function delJournal(i) { if(confirm("刪除？")){ db.journals[activeDS].splice(i,1); save(); renderJournals(); }}
    function exportData() { const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Backup.json`; a.click(); }
    function triggerImport() { document.getElementById('importFile').click(); }
    function importJSON(event) { const reader = new FileReader(); reader.onload = function(e) { try { db = JSON.parse(e.target.result); save(); location.reload(); } catch (err) { alert("失敗"); } }; reader.readAsText(event.target.files[0]); }
    
    function goToday() { 
        const today = new Date(); viewMonth = new Date(today); drawerMonth = new Date(today); 
        selectDate(getDS(today), false); 
        setTimeout(() => {
            const el = document.getElementById(`list-${getDS(today)}`);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    function toggleCalendar() {
        isCalExpanded = !isCalExpanded;
        const drawer = document.getElementById('calDrawer');
        drawer.classList.toggle('expanded', isCalExpanded);
        drawer.classList.toggle('collapsed', !isCalExpanded);
        document.getElementById('drawerArrow').innerText = isCalExpanded ? " ▲" : " ▼";
        renderMiniCal();
    }

    function renderMiniCal() {
        const grid = document.getElementById('miniCalGrid'); if(!grid) return; grid.innerHTML = '';
        ['一','二','三','四','五','六','日'].forEach(l => grid.innerHTML += `<div style="font-size:0.75rem; color:#888;">${l}</div>`);
        const y = drawerMonth.getFullYear(), m = drawerMonth.getMonth();
        document.getElementById('miniMonthTitle').innerText = `${monthNames[m]} ${y}`;
        if (isCalExpanded) {
            let firstDay = new Date(y, m, 1).getDay(); firstDay = (firstDay === 0) ? 6 : firstDay - 1; 
            const lastDate = new Date(y, m+1, 0).getDate();
            for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;
            for(let d=1; d<=lastDate; d++) {
                const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                grid.innerHTML += `<div class="cal-date ${ds===activeDS?'selected':''} ${ (new Date(ds).getDay()===0||new Date(ds).getDay()===6)?'is-weekend':''}" onclick="selectDate('${ds}')">${d}</div>`;
            }
        } else {
            const curr = new Date(activeDS); const diff = (curr.getDay() === 0 ? -6 : 1 - curr.getDay());
            const start = new Date(curr); start.setDate(curr.getDate() + diff);
            for(let i=0; i<7; i++) {
                const d = new Date(start); d.setDate(start.getDate() + i); const ds = getDS(d);
                grid.innerHTML += `<div class="cal-date ${ds===activeDS?'selected':''} ${ (d.getDay()===0||d.getDay()===6)?'is-weekend':''}" onclick="selectDate('${ds}')">${d.getDate()}</div>`;
            }
        }
    }

    function renderWeek() {
        const grid = document.getElementById('weekGrid'); if(!grid) return; grid.innerHTML = '';
        const curr = new Date(activeDS); const day = curr.getDay();
        const diff = (day === 0 ? -6 : 1 - day);
        const start = new Date(curr); start.setDate(curr.getDate() + diff);
        document.getElementById('weekTitle').innerText = `${start.getFullYear()} / ${start.getMonth()+1}月`;
        for(let i=0; i<7; i++) {
            const d = new Date(start); d.setDate(start.getDate() + i); const ds = getDS(d);
            grid.innerHTML += `<div class="week-card ${ds===getDS(new Date())?'today':''}">
                <div class="week-day-title" onclick="selectDate('${ds}')">
                    <span style="color:${(d.getDay()===0||d.getDay()===6)?'var(--accent-red)':'white'}">${d.getMonth()+1}/${d.getDate()} (${weekDaysShort[d.getDay()]})</span>
                </div>
                <div class="week-day-content sync-${ds}" contenteditable="true" onblur="updateCal('${ds}', this.innerText)">${db.calendar[ds]||''}</div>
            </div>`;
        }
    }

    function renderList() {
        const list = document.getElementById('calendarList'); if(!list) return; list.innerHTML = '';
        const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
        document.getElementById('monthTitle').innerText = `${monthNames[m]} ${y}`;
        const lastDay = new Date(y, m+1, 0).getDate();
        for(let d=1; d<=lastDay; d++) {
            const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isWeekend = (new Date(ds).getDay()===0||new Date(ds).getDay()===6);
            list.innerHTML += `<div class="day-row ${ds === activeDS?'selected':''}" id="list-${ds}">
                <div class="day-num-box" onclick="selectDate('${ds}', false)">
                    <div class="day-num ${isWeekend?'is-weekend-text':''}">${d}</div>
                    <div class="day-weekday ${isWeekend?'is-weekend-text':''}">${weekDaysShort[new Date(ds).getDay()]}</div>
                </div>
                <div class="day-content sync-${ds}" contenteditable="true" onblur="updateCal('${ds}', this.innerText)">${db.calendar[ds]||''}</div>
            </div>`;
        }
    }

    function linkify(text) {
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const parts = text.split(urlRegex);
        const frag = document.createDocumentFragment();
        parts.forEach(part => {
            if (/^https?:\/\//.test(part)) {
                const a = document.createElement('a');
                a.href = part;
                a.textContent = part;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.style.cssText = 'color:#64b5f6;word-break:break-all;text-decoration:none;border-bottom:1px solid rgba(100,181,246,0.35);';
                frag.appendChild(a);
            } else if (part) {
                frag.appendChild(document.createTextNode(part));
            }
        });
        return frag;
    }

    function renderBookmarkUI() {
        if(isManaging) { renderManageUI(); return; }
        const tabs = document.getElementById('bookmarkTabs'); if(!tabs) return;
        tabs.innerHTML = '';
        db.catOrder.forEach(cat => {
            tabs.innerHTML += `<button class="btn-sm" style="white-space:nowrap; border-radius:20px; ${currentCat===cat?'background:var(--accent-gray);color:black':''}" onclick="currentCat='${cat}';renderBookmarkUI()">${cat}</button>`;
        });
        const content = document.getElementById('bookmarkContent'); if(!content) return;
        content.innerHTML = '';
        (db.bookmarks[currentCat] || []).forEach((b, i) => {
            const item = document.createElement('div');
            item.className = 'bookmark-item';
            const delBtn = document.createElement('button');
            delBtn.className = 'bm-del-btn';
            delBtn.textContent = '✕';
            delBtn.onclick = () => delBookmarkItem(i);
            const textDiv = document.createElement('div');
            textDiv.className = 'bm-text';
            textDiv.appendChild(linkify(b.text));
            const dateSpan = document.createElement('span');
            dateSpan.className = 'bm-date';
            dateSpan.textContent = b.date || '';
            item.appendChild(delBtn);
            item.appendChild(textDiv);
            item.appendChild(dateSpan);
            content.appendChild(item);
        });
        content.scrollTop = content.scrollHeight;
    }

    function toggleBookmarkManage() {
        isManaging = !isManaging;
        document.getElementById('bookmarkNormalUI').style.display = isManaging ? 'none' : 'flex';
        document.getElementById('bookmarkManageUI').style.display = isManaging ? 'flex' : 'none';
        document.getElementById('manageBtn').innerText = isManaging ? "✅ 完成" : "⚙️ 管理";
        if(isManaging) renderManageUI(); else renderBookmarkUI();
    }

    function renderManageUI() {
        const list = document.getElementById('categoryManageList'); 
        if(!list) return;
        list.innerHTML = '';
        db.catOrder.forEach((cat, idx) => {
            const isFirst = idx === 0, isLast = idx === db.catOrder.length - 1;
            list.innerHTML += `
            <div style="display:flex; align-items:center; gap:8px; background:#252525; padding:10px 12px; border-radius:10px; margin-bottom:10px; border:1px solid #333;">
                <div style="display:flex; flex-direction:column; gap:2px;">
                    <button onclick="moveCat(${idx},-1)" style="background:none;border:none;color:${isFirst?'#444':'#aaa'};font-size:0.8rem;cursor:pointer;padding:2px 5px;line-height:1;" ${isFirst?'disabled':''}>▲</button>
                    <button onclick="moveCat(${idx},1)" style="background:none;border:none;color:${isLast?'#444':'#aaa'};font-size:0.8rem;cursor:pointer;padding:2px 5px;line-height:1;" ${isLast?'disabled':''}>▼</button>
                </div>
                <input type="text" value="${cat}" style="flex:1; background:transparent; border:1px solid #444; color:white; padding:7px 10px; border-radius:6px; font-size:0.9rem; outline:none;" onchange="renameCat(${idx}, this.value)">
                <button onclick="deleteCat(${idx})" style="background:none;border:none;color:#ff453a;font-size:1.1rem;cursor:pointer;padding:4px 6px;">🗑️</button>
            </div>`;
        });
    }

    function addCat() {
        const input = document.getElementById('newCatInput');
        const name = input.value.trim();
        if(!name) return;
        if(db.catOrder.includes(name)) { alert("分類名稱已存在"); return; }
        db.catOrder.push(name);
        if(!db.bookmarks[name]) db.bookmarks[name] = [];
        input.value = '';
        save(); renderManageUI();
    }

    function renameCat(idx, newName) {
        newName = newName.trim();
        if(!newName) return;
        const old = db.catOrder[idx];
        if(old === newName) return;
        if(db.catOrder.includes(newName)) { alert("名稱已存在"); renderManageUI(); return; }
        db.catOrder[idx] = newName;
        db.bookmarks[newName] = db.bookmarks[old] || [];
        delete db.bookmarks[old];
        if(currentCat === old) currentCat = newName;
        save(); renderManageUI();
    }

    function deleteCat(idx) {
        const cat = db.catOrder[idx];
        const count = (db.bookmarks[cat] || []).length;
        if(count > 0 && !confirm(`「${cat}」含有 ${count} 筆書籤，確定刪除？`)) return;
        if(count === 0 && !confirm(`刪除分類「${cat}」？`)) return;
        db.catOrder.splice(idx, 1);
        delete db.bookmarks[cat];
        if(currentCat === cat) currentCat = db.catOrder[0] || '';
        save(); renderManageUI();
    }

    function moveCat(idx, dir) {
        const newIdx = idx + dir;
        if(newIdx < 0 || newIdx >= db.catOrder.length) return;
        [db.catOrder[idx], db.catOrder[newIdx]] = [db.catOrder[newIdx], db.catOrder[idx]];
        save(); renderManageUI();
    }

    function addBookmarkContent() {
        const input = document.getElementById('bmInput'); if(!input.value.trim() || !currentCat) return;
        if(!db.bookmarks[currentCat]) db.bookmarks[currentCat] = [];
        db.bookmarks[currentCat].push({ date: new Date().toLocaleDateString(), text: input.value });
        input.value = ''; save(); renderBookmarkUI();
    }
    function delBookmarkItem(idx) { if(confirm("刪除內容？")) { db.bookmarks[currentCat].splice(idx, 1); save(); renderBookmarkUI(); }}

    window.onload = () => { 
        goToday(); 
        if(window.innerWidth >= 768) switchPanel(0); 
        else switchPanel(0);
        updateInputTime();
        setInterval(() => { if(document.activeElement !== document.getElementById('jnTimeInput')) updateInputTime(); }, 60000);
    };
</script>
</body>
</html>
